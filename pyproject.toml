[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "kicad-pcb-skill"
version = "0.1.0"
description = "KiCad PCB automation skill for OpenClaw"
requires-python = ">=3.11,<3.12"
dependencies = [
    "kiutils>=1.4",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["kicad-pcb/src"]
addopts = "-q --strict-markers"
markers = [
    "integration: marks tests as integration tests (may require external tools)",
    "requires_kicad: marks tests that need kicad-cli installed",
    "unit: marks fast unit tests with no external deps",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PTH", "SIM", "PL"]
ignore = ["PLR2004"]  # magic value comparisons — acceptable in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["kicad-pcb/src"]

[tool.setuptools.packages.find]
where = ["kicad-pcb/src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
# cairosvg is an optional runtime dep (PNG preview); no type stubs available.
module = "cairosvg"
ignore_missing_imports = true
