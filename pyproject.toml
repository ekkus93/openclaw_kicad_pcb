[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-pcb-webapp"
version = "0.1.0"
description = "Python web app for generating KiCad projects from Circuit IR"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.scripts]
kicad-refine = "kicad_pcb_web.refinement_cli:main"

[project.optional-dependencies]
dev = [
    "kiutils>=1.4",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]
web = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: marks tests as integration tests (may require external tools)",
    "requires_kicad: marks tests that need KiCad CLI, system KiCad assets, or the full KiCad generation toolchain",
    "unit: marks fast unit tests with no external deps",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PTH", "SIM", "PL"]
ignore = ["PLR2004", "PLR0912"]  # magic value comparisons, complex functions

[tool.ruff.lint.per-file-ignores]
"src/kicad_pcb/refinement/operations.py" = ["PLR0911", "SIM102"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kicad_pcb = ["resources/symbols/*.kicad_sym"]
kicad_pcb_web = [
    "static/spa/index.html",
    "static/spa/favicon.svg",
    "static/spa/icons.svg",
    "static/spa/assets/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.mypy]
python_version = "3.11"
exclude = ['(^|/)legacy/openclaw-skill/scripts/kicad_pcb\.py$']

[[tool.mypy.overrides]]
# cairosvg is an optional runtime dep (PNG preview); no type stubs available.
module = "cairosvg"
ignore_missing_imports = true
