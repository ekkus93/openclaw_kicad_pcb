name: RESTART1 Direct Apply

on:
  push:
    branches: [webapp]

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 0298a9f3f3139367a3e437a0464ed2eb18c3a07f
      CARRIER_SHA: e17c2aca1e795a7d897272eb37b34bb3f9dd67f8
      EXPECTED_PAYLOAD_SHA256: 6374147fa46ba6d0acbffeed09e066a889759dce725e21dcff415c5cbfc9e6bb
      EXPECTED_WEBAPP_HEAD: ${{ github.sha }}
      PR_NUMBER: 1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: webapp
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/contents/.restart1-direct/READY?ref=${CARRIER_SHA}" \
            >/tmp/restart1-ready
          test "$(cat /tmp/restart1-ready)" = "${EXPECTED_PAYLOAD_SHA256}"

          : >/tmp/restart1-payload.b64
          for path in \
            p1-0.b64 \
            p1-1.b64 \
            p1-2.b64 \
            p1-3.b64 \
            p1-4a.b64 \
            p1-4b.b64 \
            p1-5.b64 \
            payload-2a.b64 \
            tail-0.b64 \
            tail-1.b64 \
            tail-2.b64 \
            tail-3.b64; do
            gh api \
              -H 'Accept: application/vnd.github.raw+json' \
              "repos/${GITHUB_REPOSITORY}/contents/.restart1-direct/${path}?ref=${CARRIER_SHA}" \
              >>/tmp/restart1-payload.b64
          done

          base64 --decode /tmp/restart1-payload.b64 >/tmp/restart1-payload.tar.gz
          test "$(sha256sum /tmp/restart1-payload.tar.gz | cut -d' ' -f1)" = "${EXPECTED_PAYLOAD_SHA256}"
          gzip -t /tmp/restart1-payload.tar.gz

      - name: Apply implementation on clean webapp baseline
        run: |
          set -euo pipefail
          git fetch origin webapp
          test "$(git rev-parse HEAD)" = "${EXPECTED_WEBAPP_HEAD}"
          git checkout --detach "${BASE_SHA}"
          tar -xzf /tmp/restart1-payload.tar.gz -C .
          while IFS= read -r path; do
            test -n "${path}"
            case "${path}" in
              /*|*'..'*) echo "Unsafe deletion path: ${path}" >&2; exit 1 ;;
            esac
            rm -rf -- "${path}"
          done <.restart1-delete-paths
          rm -f .restart1-delete-paths
          test ! -e .github/workflows/restart1-direct-apply.yml
          test ! -e .github/workflows/restart1-bootstrap.yml
          test ! -e .restart1
          test ! -e .restart1-direct

      - name: Commit directly to webapp
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Implement RESTART1 hardening pass'
          git push \
            --force-with-lease="refs/heads/webapp:${EXPECTED_WEBAPP_HEAD}" \
            origin HEAD:refs/heads/webapp

      - name: Close obsolete PR and delete carrier branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr close "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --delete-branch \
            --comment 'RESTART1 was applied directly to webapp. Closing and deleting the temporary carrier branch.'
