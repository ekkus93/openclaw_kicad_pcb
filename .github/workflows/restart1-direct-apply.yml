name: RESTART1 Direct Apply

on:
  push:
    branches: [webapp]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      CARRIER_SHA: e17c2aca1e795a7d897272eb37b34bb3f9dd67f8
      EXPECTED_PAYLOAD_SHA256: 6374147fa46ba6d0acbffeed09e066a889759dce725e21dcff415c5cbfc9e6bb
      TRIGGER_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: webapp
          fetch-depth: 0
          persist-credentials: true

      - name: Detect completed implementation
        id: state
        run: |
          set -euo pipefail
          if test -f src/kicad_pcb_web/services/atomic_io.py; then
            echo 'apply=false' >>"${GITHUB_OUTPUT}"
            echo 'RESTART1 implementation is already present; no-op.'
          else
            echo 'apply=true' >>"${GITHUB_OUTPUT}"
          fi

      - name: Reconstruct and verify payload
        if: steps.state.outputs.apply == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/contents/.restart1-direct/READY?ref=${CARRIER_SHA}" \
            >/tmp/restart1-ready
          test "$(cat /tmp/restart1-ready)" = "${EXPECTED_PAYLOAD_SHA256}"

          : >/tmp/restart1-payload.b64
          for path in \
            p1-0.b64 \
            p1-1.b64 \
            p1-2.b64 \
            p1-3.b64 \
            p1-4a.b64 \
            p1-4b.b64 \
            p1-5.b64 \
            payload-2a.b64 \
            tail-0.b64 \
            tail-1.b64 \
            tail-2.b64 \
            tail-3.b64; do
            gh api \
              -H 'Accept: application/vnd.github.raw+json' \
              "repos/${GITHUB_REPOSITORY}/contents/.restart1-direct/${path}?ref=${CARRIER_SHA}" \
              >>/tmp/restart1-payload.b64
          done

          base64 --decode /tmp/restart1-payload.b64 >/tmp/restart1-payload.tar.gz
          test "$(sha256sum /tmp/restart1-payload.tar.gz | cut -d' ' -f1)" = "${EXPECTED_PAYLOAD_SHA256}"
          gzip -t /tmp/restart1-payload.tar.gz

      - name: Apply non-workflow implementation changes
        if: steps.state.outputs.apply == 'true'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TRIGGER_SHA}"
          tar -xzf /tmp/restart1-payload.tar.gz -C .
          while IFS= read -r path; do
            test -n "${path}"
            case "${path}" in
              /*|*'..'*) echo "Unsafe deletion path: ${path}" >&2; exit 1 ;;
            esac
            rm -rf -- "${path}"
          done <.restart1-delete-paths
          rm -f .restart1-delete-paths
          rm -rf .restart1 .restart1-direct
          rm -f .github/workflows/restart1-bootstrap.yml
          rm -f .github/workflows/restart1-apply.yml

          # GITHUB_TOKEN may not create, modify, or delete workflow files.
          # Restore every workflow file to the triggering commit and publish
          # the workflow changes separately through the authenticated connector.
          git restore --source=HEAD -- .github/workflows
          git diff --exit-code -- .github/workflows

      - name: Commit directly to webapp
        if: steps.state.outputs.apply == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --stat
          git commit -m 'Implement RESTART1 hardening pass'
          git push origin HEAD:refs/heads/webapp
