name: Refinement Loop Checkpoint

on:
  push:
    branches: [webapp]
    paths:
      - '.github/workflows/refinement-loop-checkpoint.yml'

permissions:
  contents: write

env:
  KICAD_SYMBOLS_DIR: /usr/share/kicad/symbols

jobs:
  verify-and-checkpoint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y graphviz kicad-symbols
          command -v dot
          test -d "$KICAD_SYMBOLS_DIR"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Add bounded iterative refinement loop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = 'ekkus93/openclaw_kicad_pcb'

          def fetch_blob(sha: str) -> str:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={
                      'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)
              if payload.get('encoding') != 'base64':
                  raise SystemExit(f'unexpected blob encoding for {sha}')
              return base64.b64decode(payload['content']).decode('utf-8')

          service_path = Path('src/kicad_pcb_web/services/schematic_refinement.py')
          text = service_path.read_text(encoding='utf-8')
          marker = '\ndef _reject_candidate(\n'
          if text.count(marker) != 1:
              raise SystemExit('unexpected schematic_refinement insertion marker count')
          block = fetch_blob('42fdcd549f58a95e6bbcc393330d5ae61706a88b')
          service_path.write_text(text.replace(marker, '\n' + block + marker), encoding='utf-8')

          test_path = Path('tests/web/test_web_schematic_refinement_loop.py')
          test_path.write_text(fetch_blob('93723b999b0f9f2d1c12bf65512072bd5ef6e3d7'), encoding='utf-8')

          operations_path = Path('src/kicad_pcb/refinement/operations.py')
          operations = operations_path.read_text(encoding='utf-8')
          old_call = (
              '    _validate_anchor_move_safety(doc, component, mapping, moving_old, moving_new)\n'
          )
          new_call = '    _validate_anchor_move_safety(doc, component, mapping, moving_new)\n'
          if operations.count(old_call) != 1:
              raise SystemExit('unexpected refinement anchor-safety call count')
          operations = operations.replace(old_call, new_call)

          old_signature = (
              'def _validate_anchor_move_safety(\n'
              '    doc: SchematicDoc,\n'
              '    component: PlacedSchematicComponent,\n'
              '    mapping: Mapping[tuple[float, float], tuple[float, float]],\n'
              '    moving_old: set[tuple[float, float]],\n'
              '    moving_new: set[tuple[float, float]],\n'
              ') -> None:\n'
          )
          new_signature = (
              'def _validate_anchor_move_safety(\n'
              '    doc: SchematicDoc,\n'
              '    component: PlacedSchematicComponent,\n'
              '    mapping: Mapping[tuple[float, float], tuple[float, float]],\n'
              '    moving_new: set[tuple[float, float]],\n'
              ') -> None:\n'
          )
          if operations.count(old_signature) != 1:
              raise SystemExit('unexpected refinement anchor-safety signature count')
          operations = operations.replace(old_signature, new_signature)

          old_wire_checks = (
              '    for wire in _wire_nodes(doc):\n'
              '        points = _wire_points(wire)\n'
              '        for old in moving_old:\n'
              '            if _point_on_polyline_interior(old, points):\n'
              '                raise UserError(\n'
              '                    "Moving pin touches wire interior; mutation is ambiguous.",\n'
              '                    code="REFINEMENT_AMBIGUOUS_TARGET",\n'
              '                )\n'
              '        for new in moving_new:\n'
              '            contacts_wire = any(_point_on_segment(new, a, b) for a, b in zip(points, points[1:]))\n'
              '            if contacts_wire and new not in points:\n'
              '                raise UserError(\n'
              '                    "Moved pin would create an unintended wire contact.",\n'
              '                    code="REFINEMENT_AMBIGUOUS_TARGET",\n'
              '                )\n'
          )
          new_wire_checks = (
              '    for wire in _wire_nodes(doc):\n'
              '        points = _wire_points(wire)\n'
              '        for old in mapping:\n'
              '            if _point_on_polyline_interior(old, points):\n'
              '                raise UserError(\n'
              '                    "Moving pin touches wire interior; mutation is ambiguous.",\n'
              '                    code="REFINEMENT_AMBIGUOUS_TARGET",\n'
              '                )\n'
              '        for new in mapping.values():\n'
              '            contacts_wire = any(_point_on_segment(new, a, b) for a, b in zip(points, points[1:]))\n'
              '            if contacts_wire and new not in points:\n'
              '                raise UserError(\n'
              '                    "Moved pin would create an unintended wire contact.",\n'
              '                    code="REFINEMENT_AMBIGUOUS_TARGET",\n'
              '                )\n'
          )
          if operations.count(old_wire_checks) != 1:
              raise SystemExit('unexpected refinement anchor-safety wire-check count')
          operations_path.write_text(
              operations.replace(old_wire_checks, new_wire_checks), encoding='utf-8'
          )
          PY
      - name: Sync locked toolchain
        run: uv sync --frozen --extra dev --extra web
      - name: Canonical format and validate
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            set -e
            FILES=(
              src/kicad_pcb/refinement/operations.py
              src/kicad_pcb_web/services/schematic_refinement.py
              tests/web/test_web_schematic_refinement_loop.py
            )
            uv run ruff check --fix --select I "${FILES[@]}"
            uv run ruff format "${FILES[@]}"
            uv run ruff check .
            uv run ruff format --check .
            uv run mypy src/kicad_pcb src/kicad_pcb_web
            uv run pytest -vv --tb=long tests/unit/test_refinement_operations.py tests/web/test_web_schematic_refinement.py tests/web/test_web_schematic_refinement_loop.py
            uv run pytest -q tests/unit tests/web
            git diff --check
          } 2>&1 | tee refinement-checkpoint.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload checkpoint failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: refinement-loop-checkpoint-failure
          path: refinement-checkpoint.log
          if-no-files-found: error
          retention-days: 1
      - name: Commit verified bounded refinement loop
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/kicad_pcb/refinement/operations.py \
            src/kicad_pcb_web/services/schematic_refinement.py \
            tests/web/test_web_schematic_refinement_loop.py
          git commit -m 'feat: add bounded iterative schematic refinement loop'
          git push origin HEAD:webapp
