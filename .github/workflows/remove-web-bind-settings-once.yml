name: Remove Web Bind Settings Once

on:
  push:
    branches:
      - webapp
    paths:
      - '.github/workflows/remove-web-bind-settings-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: webapp
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra web
      - name: Remove inert web bind settings
        run: python .github/scripts/remove_web_bind_settings_once.py
      - name: Normalize touched Python
        run: |
          uv run ruff check --fix src/kicad_pcb_web/settings.py tests/web/test_web_settings.py
          uv run ruff format src/kicad_pcb_web/settings.py tests/web/test_web_settings.py
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/kicad_pcb_web/settings.py tests/web/test_web_settings.py
          git diff --cached --check
          git commit -m 'fix: remove inert web bind settings'
          git push origin HEAD:webapp
