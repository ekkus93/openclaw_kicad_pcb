name: Remove Web Bind Settings Once

on:
  push:
    branches:
      - webapp
    paths:
      - '.github/workflows/remove-web-bind-settings-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: webapp
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra web
      - name: Remove inert web bind settings
        run: >-
          python -c 'from pathlib import Path; p=Path("src/kicad_pcb_web/settings.py"); s=p.read_text(encoding="utf-8"); reps=[("_WEB_CONFIG_KEYS: frozenset[str] = frozenset(\n    {\"data_dir\", \"default_host\", \"default_port\", \"mutation_lock_timeout_s\"}\n)\n", "_WEB_CONFIG_KEYS: frozenset[str] = frozenset({\"data_dir\", \"mutation_lock_timeout_s\"})\n"), ("_REMOVED_NETWORK_PROBE_ENV = \"KICAD_PCB_WEB_LLM_NETWORK_PROBE_ENABLED\"\n", "_REMOVED_NETWORK_PROBE_ENV = \"KICAD_PCB_WEB_LLM_NETWORK_PROBE_ENABLED\"\n_REMOVED_WEB_BIND_ENVS: frozenset[str] = frozenset({\"KICAD_PCB_WEB_HOST\", \"KICAD_PCB_WEB_PORT\"})\n"), ("    default_host: str = \"127.0.0.1\"\n    default_port: int = 8000\n", ""), ("    config_file = _load_config_file()\n", "    for removed_env in _REMOVED_WEB_BIND_ENVS:\n        if removed_env in os.environ:\n            raise ValueError(\n                f\"{removed_env} has been removed; pass host/port to the ASGI server\"\n            )\n\n    config_file = _load_config_file()\n"), ("    default_host = _read_setting(\n        env_name=\"KICAD_PCB_WEB_HOST\",\n        config_value=web_config.get(\"default_host\"),\n        default=\"127.0.0.1\",\n    )\n    default_port_raw = _read_setting(\n        env_name=\"KICAD_PCB_WEB_PORT\",\n        config_value=web_config.get(\"default_port\"),\n        default=8000,\n    )\n", ""), ("    default_port = _coerce_int(default_port_raw, field_name=\"web.default_port\")\n    if not 1 <= default_port <= 65535:\n        raise ValueError(\"web.default_port must be between 1 and 65535\")\n\n", ""), ("        default_host=str(default_host),\n        default_port=default_port,\n", "")]; [(lambda old,new: (_ for _ in ()).throw(AssertionError(f\"Expected block not found: {old[:60]!r}\")) if old not in s else None)(old,new) for old,new in reps]; [None for old,new in reps if not (s:=s.replace(old,new,1))]; p.write_text(s, encoding="utf-8")'
      - name: Normalize touched Python
        run: |
          uv run ruff check --fix src/kicad_pcb_web/settings.py tests/web/test_web_settings.py
          uv run ruff format src/kicad_pcb_web/settings.py tests/web/test_web_settings.py
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/kicad_pcb_web/settings.py tests/web/test_web_settings.py
          git diff --cached --check
          git commit -m 'fix: remove inert web bind settings'
          git push origin HEAD:webapp
