name: Bounded Wizard LLM Robustness Ralph v3

on:
  push:
    branches: [webapp]
    paths:
      - .github/scripts/patch_wizard_llm_robustness_helper.py
      - .github/workflows/ralph-wizard-llm-robustness-v3.yml

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  KICAD_SYMBOLS_DIR: /usr/share/kicad/symbols

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Assert expected green baseline is ancestor
        run: git merge-base --is-ancestor b5855cc3f0e984f3a189b17fec37ac1cf8685de1 HEAD

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y graphviz kicad-symbols
          test -d "$KICAD_SYMBOLS_DIR"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen --extra dev --extra web

      - name: Patch temporary helper
        run: python .github/scripts/patch_wizard_llm_robustness_helper.py

      - name: Apply D1-D7 and run targeted/full gates
        run: uv run python .github/scripts/apply_wizard_llm_robustness.py

      - name: Enforce scope boundary
        run: |
          git diff --name-only
          if git diff --name-only | grep -E '^(src/kicad_pcb/|frontend/|src/kicad_pcb_web/static/spa/)'; then
            echo 'Forbidden deterministic engine/frontend/generated SPA scope change detected' >&2
            exit 1
          fi

      - name: Commit validated implementation and self-delete all temporary helpers
        run: |
          git rm .github/scripts/apply_wizard_llm_robustness.py
          git rm .github/scripts/patch_wizard_llm_robustness_helper.py
          git rm .github/workflows/ralph-wizard-llm-robustness.yml
          git rm .github/workflows/ralph-wizard-llm-robustness-v2.yml
          git rm .github/workflows/ralph-wizard-llm-robustness-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src/kicad_pcb_web tests/unit/test_wizard_llm_robustness.py tests/web/test_web_wizard.py
          git diff --cached --check
          git status --short
          git commit -m "fix: harden wizard LLM robustness"
          git push origin HEAD:webapp
