name: Format check_ci_config once

on:
  push:
    branches: [webapp]

permissions:
  contents: write

jobs:
  format:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          ref: webapp
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - run: uv sync --frozen --extra dev --extra web
      - name: Apply exact Ruff formatting
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format scripts/check_ci_config.py
          uv run ruff format --check scripts/check_ci_config.py
          uv run ruff check scripts/check_ci_config.py
          if git diff --quiet -- scripts/check_ci_config.py; then
            echo "No formatter delta"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_ci_config.py
          git commit -m "style: format CI configuration guard"
          git push origin HEAD:webapp
