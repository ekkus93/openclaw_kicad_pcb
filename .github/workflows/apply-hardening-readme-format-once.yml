name: Apply Hardening README and Format Once

on:
  push:
    branches:
      - webapp
    paths:
      - '.github/workflows/apply-hardening-readme-format-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: webapp
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra web
      - name: Apply exact README hardening updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'network_probe_enabled = false\ndebug_artifact_capture = false\n',
                  'debug_artifact_capture = false\n'
                  'retry_max_attempts = 3\n'
                  'retry_base_delay_s = 0.5\n'
                  'retry_max_delay_s = 8.0\n'
                  'retry_jitter_s = 0.25\n',
              ),
              (
                  'Invalid provider configuration now fails fast when the app loads settings.\n',
                  'Runtime configuration is validated during application startup before the server accepts requests. '
                  'An explicitly configured `KICAD_PCB_WEB_CONFIG_FILE` must exist and be readable; unknown TOML keys '
                  'and unsupported settings fail closed instead of silently reverting to defaults. Settings are cached '
                  'as one process snapshot, so restart the server after changing provider/model configuration. The old '
                  '`network_probe_enabled` option was removed because active network probing is not implemented.\n',
              ),
              (
                  '- Sending another conversation message clears spec approval, active Circuit IR,\n'
                  '  and the active generation result link.\n'
                  '- Sending a revision note from the spec step clears active Circuit IR and the\n'
                  '  active generation result link.\n'
                  '- Regenerating Circuit IR clears the active generation result link before the\n'
                  '  new IR becomes current.\n',
                  '- A successful conversation/spec revision invalidates approval, Circuit IR, and the active job link.\n'
                  '- A failed replacement preserves the last-known-good checkpoint for inspection but does not make it '\
                  'the result of the failed operation.\n'
                  '- Failed IR regeneration never unlocks Generate from stale preserved IR; retry is explicit and '\
                  'operation-aware.\n'
                  '- LLM-backed continuation fails with `WIZARD_LLM_PROVENANCE_MISMATCH` if provider, model, prompt '\
                  'version, or endpoint identity changed after the persisted revision. Historical sessions remain readable.\n',
              ),
              (
                  'The web app defaults to `internal` validation for job generation. Optional KiCad\n'
                  'CLI validation is available only when `kicad-cli` is installed and a request\n'
                  'explicitly asks for `validation="kicad"`.\n',
                  'The web app defaults to `internal` validation for job generation. Optional KiCad\n'
                  'CLI validation is available only when `kicad-cli` is installed and a request\n'
                  'explicitly asks for `validation="kicad"`. Synchronous direct generation returns a non-2xx response '\
                  'when generation fails even though the failed job remains persisted; unexpected failures expose the same '\
                  'non-secret correlation ID in the response, job record, and server log. Schematic PNG preview generation '\
                  'requires both `kicad-cli` and `rsvg-convert`. Preview-only failure is an intentional visible degraded mode: '\
                  'the job may succeed with `project.zip` plus `PREVIEW_GENERATION_SKIPPED`.\n',
              ),
              (
                  'Unexpected server failures are logged with a correlation ID and exposed through a\n'
                  'sanitized API error rather than raw exception text.\n',
                  'Unexpected server failures are logged with a correlation ID and exposed through a\n'
                  'sanitized API error rather than raw exception text. LLM-produced spec/IR revisions persist non-secret '\
                  'provider/model/prompt/config provenance so a restart cannot silently continue a session under a different '\
                  'model. `debug_artifact_capture` remains opt-in and may store full prompts, completions, parsed output, and '\
                  'repair context; normal request-log redaction does not redact those files, so treat them as sensitive local data.\n',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected README block not found: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Normalize touched Python files
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/kicad_pcb_web/settings.py')
          text = path.read_text(encoding='utf-8')
          old = '            f"{_REMOVED_NETWORK_PROBE_ENV} has been removed; active network probing is not implemented"\n'
          new = ('            f"{_REMOVED_NETWORK_PROBE_ENV} has been removed; "\n'
                 '            "active network probing is not implemented"\n')
          if old not in text:
              raise SystemExit('Expected settings line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          uv run ruff check --fix src/kicad_pcb_web/settings.py src/kicad_pcb_web/services/wizard.py tests/web/test_web_wizard_provenance.py
          uv run ruff format src/kicad_pcb_web/settings.py src/kicad_pcb_web/services/wizard.py tests/web/test_web_wizard_provenance.py
      - name: Commit normalized files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md src/kicad_pcb_web/settings.py src/kicad_pcb_web/services/wizard.py tests/web/test_web_wizard_provenance.py
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'docs: align hardening runtime guidance'
          git push origin HEAD:webapp
