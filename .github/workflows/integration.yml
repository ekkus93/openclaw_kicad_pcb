name: Integration tests

on:
  schedule:
    # Nightly at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  integration:
    name: Integration tests (KiCad required)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Install KiCad ────────────────────────────────────────────────────────
      - name: Add KiCad PPA and install
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9-releases
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends kicad
          kicad-cli version

      # ── Python setup ─────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # ── Integration tests ────────────────────────────────────────────────────
      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            -m requires_kicad \
            -v \
            --tb=long \
            --junit-xml=integration-results.xml

      # ── Artifacts (always upload on failure) ─────────────────────────────────
      - name: Upload test results and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-artifacts-${{ github.run_id }}
          path: |
            integration-results.xml
            /tmp/pytest-*/
          retention-days: 7
