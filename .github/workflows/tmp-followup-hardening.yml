name: Temporary follow-up hardening apply

on:
  push:
    branches: [webapp]
    paths:
      - ".github/workflows/tmp-followup-hardening.yml"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  KICAD_SYMBOLS_DIR: /usr/share/kicad/symbols

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y graphviz kicad-symbols
          command -v dot
          test -d "$KICAD_SYMBOLS_DIR"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen --extra dev --extra web

      - name: Reconfirm implementation-start baseline gates
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src/kicad_pcb src/kicad_pcb_web
          uv run pytest tests/unit tests/web -q

      - name: Ensure branch did not move
        run: |
          git fetch origin webapp
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/webapp)" = "$GITHUB_SHA"

      - name: Apply F1-F8 follow-up hardening
        run: |
          python .github/tmp_followup_hardening_apply
          python .github/tmp_followup_hardening_fix_json

      - name: Normalize Python formatting and imports
        run: |
          uv run ruff check . --fix
          uv run ruff format .
          uv run ruff check .
          uv run ruff format --check .

      - name: Run targeted follow-up regressions
        run: |
          uv run pytest \
            tests/unit/test_wizard_llm_robustness.py \
            tests/web/test_web_llm_clients.py \
            tests/web/test_web_wizard.py \
            tests/web/test_web_settings.py \
            -q

      - name: Run final required gates
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src/kicad_pcb src/kicad_pcb_web
          uv run pytest tests/unit tests/web -q

      - name: Enforce follow-up hardening scope
        run: |
          python - <<'PY'
          import subprocess

          allowed = {
              "src/kicad_pcb_web/settings.py",
              "src/kicad_pcb_web/services/_wizard_llm.py",
              "src/kicad_pcb_web/services/_wizard_session_io.py",
              "src/kicad_pcb_web/services/wizard.py",
              "src/kicad_pcb_web/wizard_models.py",
              "tests/unit/test_wizard_llm_robustness.py",
              "tests/web/test_web_llm_clients.py",
              "tests/web/test_web_settings.py",
              "tests/web/test_web_wizard.py",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"unexpected changed files: {unexpected}")
          if not changed:
              raise SystemExit("follow-up hardening produced no product/test changes")
          print("validated changed files:")
          for path in sorted(changed):
              print(path)
          PY

      - name: Remove temporary helpers and publish validated implementation
        run: |
          git rm -f \
            .github/tmp_followup_hardening_apply \
            .github/tmp_followup_hardening_fix_json \
            .github/workflows/tmp-followup-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix: harden wizard LLM follow-up reliability"
          git push origin HEAD:webapp
