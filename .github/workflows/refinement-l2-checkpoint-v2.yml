name: Refinement L2 Checkpoint V2

on:
  push:
    branches: [webapp]
    paths:
      - '.github/workflows/refinement-l2-checkpoint-v2.yml'

permissions:
  contents: write

env:
  KICAD_SYMBOLS_DIR: /usr/share/kicad/symbols

jobs:
  verify-and-checkpoint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y graphviz kicad-symbols
          command -v dot
          test -d "$KICAD_SYMBOLS_DIR"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Implement L2 best-known retention
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'unexpected {label} match count: {count}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          service = 'src/kicad_pcb_web/services/schematic_refinement.py'
          replace_once(
              service,
              'from kicad_pcb.refinement.quality import CandidateQualityDecision, evaluate_candidate_quality\n',
              'from kicad_pcb.refinement.quality import (\n'
              '    CandidateQualityDecision,\n'
              '    evaluate_best_known_replacement,\n'
              '    evaluate_candidate_quality,\n'
              ')\n',
              'quality import',
          )
          replace_once(
              service,
              '    planned: RefinementPlanResult,\n'
              '    iteration_id: str,\n'
              ') -> RefinementApplyResult:\n'
              '    """Apply one already-validated plan transactionally and fail closed at every hard gate."""\n',
              '    planned: RefinementPlanResult,\n'
              '    iteration_id: str,\n'
              '    enforce_best_known_retention: bool = False,\n'
              ') -> RefinementApplyResult:\n'
              '    """Apply one already-validated plan transactionally and fail closed at every hard gate."""\n',
              'apply_planned signature',
          )
          quality_gate = (
              '        if quality.accepted and enforce_best_known_retention:\n'
              '            best_known = evaluate_best_known_replacement(analysis.metrics, candidate_metrics)\n'
              '            if not best_known.replaces_best:\n'
              '                quality = CandidateQualityDecision(\n'
              '                    accepted=False,\n'
              '                    code=best_known.code,\n'
              '                    reason=best_known.reason,\n'
              '                    improved_metrics=best_known.improved_metrics,\n'
              '                    comparison=best_known.comparison,\n'
              '                )\n'
          )
          replace_once(
              service,
              '        if not quality.accepted:\n'
              '            return _reject_candidate(\n',
              quality_gate
              + '        if not quality.accepted:\n'
              + '            return _reject_candidate(\n',
              'best-known quality gate',
          )
          replace_once(
              service,
              '    iteration_id: str,\n'
              '    limits: RefinementIterationLimits,\n'
              ') -> RefinementApplyResult:\n'
              '    planned = plan_schematic_refinement(\n',
              '    iteration_id: str,\n'
              '    limits: RefinementIterationLimits,\n'
              '    enforce_best_known_retention: bool = False,\n'
              ') -> RefinementApplyResult:\n'
              '    planned = plan_schematic_refinement(\n',
              'apply_once signature',
          )
          replace_once(
              service,
              '        planned=planned,\n'
              '        iteration_id=iteration_id,\n'
              '    )\n\n\n@dataclass(frozen=True)\nclass RefinementLoopLimits:',
              '        planned=planned,\n'
              '        iteration_id=iteration_id,\n'
              '        enforce_best_known_retention=enforce_best_known_retention,\n'
              '    )\n\n\n@dataclass(frozen=True)\nclass RefinementLoopLimits:',
              'apply_once forwarding',
          )
          replace_once(
              service,
              '    starting_hash: str\n'
              '    final_accepted_hash: str\n'
              '    rounds_attempted: int\n',
              '    starting_hash: str\n'
              '    final_accepted_hash: str\n'
              '    best_accepted_hash: str\n'
              '    latest_attempted_hash: str | None\n'
              '    rounds_attempted: int\n',
              'loop result fields',
          )
          replace_once(
              service,
              'class _RefinementLoopState:\n'
              '    starting_hash: str\n'
              '    iterations: list[RefinementApplyResult]\n'
              '    accepted_rounds: int = 0\n',
              'class _RefinementLoopState:\n'
              '    starting_hash: str\n'
              '    best_accepted_hash: str\n'
              '    iterations: list[RefinementApplyResult]\n'
              '    latest_attempted_hash: str | None = None\n'
              '    accepted_rounds: int = 0\n',
              'loop state fields',
          )
          replace_once(
              service,
              '    state = _RefinementLoopState(starting_hash=starting_hash, iterations=[])\n',
              '    state = _RefinementLoopState(\n'
              '        starting_hash=starting_hash,\n'
              '        best_accepted_hash=starting_hash,\n'
              '        iterations=[],\n'
              '    )\n',
              'loop state init',
          )
          replace_once(
              service,
              '        round_start_hash = _sha(accepted_path)\n'
              '        iteration_id = f"{session_id}-round-{round_number:03d}"\n',
              '        round_start_hash = _sha(accepted_path)\n'
              '        if round_start_hash != state.best_accepted_hash:\n'
              '            raise UserError(\n'
              '                "Canonical schematic no longer matches the best-known accepted state.",\n'
              '                code="REFINEMENT_BEST_KNOWN_STATE_MISMATCH",\n'
              '            )\n'
              '        iteration_id = f"{session_id}-round-{round_number:03d}"\n',
              'round state invariant',
          )
          replace_once(
              service,
              '                max_operations=min(limits.max_operations_per_round, remaining_operations),\n'
              '            ),\n'
              '        )\n'
              '        state.iterations.append(result)\n',
              '                max_operations=min(limits.max_operations_per_round, remaining_operations),\n'
              '            ),\n'
              '            enforce_best_known_retention=True,\n'
              '        )\n'
              '        state.iterations.append(result)\n'
              '        if result.candidate_hash is not None:\n'
              '            state.latest_attempted_hash = result.candidate_hash\n',
              'loop enforcement',
          )
          replace_once(
              service,
              '        state.accepted_operations += applied_count\n'
              '        state.accepted_rounds += 1\n\n'
              '        if actual_hash in seen_accepted_hashes:\n',
              '        state.accepted_operations += applied_count\n'
              '        state.accepted_rounds += 1\n'
              '        state.best_accepted_hash = actual_hash\n\n'
              '        if actual_hash in seen_accepted_hashes:\n',
              'best hash update',
          )
          replace_once(
              service,
              ') -> RefinementLoopResult:\n'
              '    return RefinementLoopResult(\n'
              '        status="stopped",\n'
              '        stop_reason=stop_reason,\n'
              '        starting_hash=state.starting_hash,\n'
              '        final_accepted_hash=_sha(accepted_path),\n'
              '        rounds_attempted=len(state.iterations),\n',
              ') -> RefinementLoopResult:\n'
              '    final_hash = _sha(accepted_path)\n'
              '    if final_hash != state.best_accepted_hash:\n'
              '        raise UserError(\n'
              '            "Final canonical schematic does not match the best-known accepted state.",\n'
              '            code="REFINEMENT_BEST_KNOWN_STATE_MISMATCH",\n'
              '        )\n'
              '    return RefinementLoopResult(\n'
              '        status="stopped",\n'
              '        stop_reason=stop_reason,\n'
              '        starting_hash=state.starting_hash,\n'
              '        final_accepted_hash=final_hash,\n'
              '        best_accepted_hash=state.best_accepted_hash,\n'
              '        latest_attempted_hash=state.latest_attempted_hash,\n'
              '        rounds_attempted=len(state.iterations),\n',
              'loop result construction',
          )

          web_test = 'tests/web/test_web_schematic_refinement.py'
          best_test = (
              '\n\ndef test_best_known_floor_rejects_mixed_tradeoff_before_promotion(\n'
              '    monkeypatch, tmp_path: Path\n'
              ') -> None:\n'
              '    accepted, ir = _fixture(tmp_path)\n'
              '    before = accepted.read_bytes()\n'
              '    analysis = _analysis(tmp_path, accepted, ir)\n'
              '    planned = _plan(analysis)\n'
              '    _install_apply_fakes(monkeypatch, analysis)\n\n'
              '    def mixed_metrics(path: Path):\n'
              '        digest = hashlib.sha256(path.read_bytes()).hexdigest()\n'
              '        return replace(\n'
              '            analysis.metrics,\n'
              '            schematic_hash=digest,\n'
              '            alignment_residual_mean_mm=1.0,\n'
              '            total_wire_manhattan_length_mm=(\n'
              '                analysis.metrics.total_wire_manhattan_length_mm + 1.27\n'
              '            ),\n'
              '        )\n\n'
              '    monkeypatch.setattr(service, "compute_refinement_metrics", mixed_metrics)\n'
              '    result = service.apply_planned_refinement(\n'
              '        accepted_path=accepted,\n'
              '        runtime=_runtime(tmp_path, ir),\n'
              '        planned=planned,\n'
              '        iteration_id="iter-1",\n'
              '        enforce_best_known_retention=True,\n'
              '    )\n\n'
              '    assert result.status == "rejected"\n'
              '    assert result.code == "REFINEMENT_BEST_KNOWN_REGRESSION"\n'
              '    assert result.quality is not None\n'
              '    assert not result.quality.accepted\n'
              '    assert accepted.read_bytes() == before\n'
          )
          replace_once(
              web_test,
              '\n\ndef test_electrical_rejection_preserves_accepted_bytes(',
              best_test + '\n\ndef test_electrical_rejection_preserves_accepted_bytes(',
              'best-known integration test',
          )

          loop_test = 'tests/web/test_web_schematic_refinement_loop.py'
          replace_once(
              loop_test,
              '        calls += 1\n'
              '        return _no_op(_sha(kwargs["accepted_path"]))\n',
              '        calls += 1\n'
              '        assert kwargs["enforce_best_known_retention"] is True\n'
              '        return _no_op(_sha(kwargs["accepted_path"]))\n',
              'loop enforcement assertion',
          )
          replace_once(
              loop_test,
              '    assert accepted.read_bytes() == b"B"\n'
              '    assert result.final_accepted_hash == _sha(accepted)\n',
              '    assert accepted.read_bytes() == b"B"\n'
              '    assert result.final_accepted_hash == _sha(accepted)\n'
              '    assert result.best_accepted_hash == result.final_accepted_hash\n'
              '    assert result.latest_attempted_hash == "c" * 64\n',
              'loop best/latest assertions',
          )
          PY
      - name: Sync locked toolchain
        run: uv sync --frozen --extra dev --extra web
      - name: Canonical format and validate
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            set -e
            FILES=(
              src/kicad_pcb/refinement/quality.py
              src/kicad_pcb_web/services/schematic_refinement.py
              tests/unit/test_refinement_quality.py
              tests/web/test_web_schematic_refinement.py
              tests/web/test_web_schematic_refinement_loop.py
            )
            uv run ruff check --fix --select I "${FILES[@]}"
            uv run ruff format "${FILES[@]}"
            uv run ruff check .
            uv run ruff format --check .
            uv run mypy src/kicad_pcb src/kicad_pcb_web
            uv run pytest -vv --tb=long \
              tests/unit/test_refinement_quality.py \
              tests/web/test_web_schematic_refinement.py \
              tests/web/test_web_schematic_refinement_loop.py
            uv run pytest -q tests/unit tests/web
            git diff --check
          } 2>&1 | tee refinement-l2-v2-checkpoint.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload checkpoint failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: refinement-l2-v2-checkpoint-failure
          path: refinement-l2-v2-checkpoint.log
          if-no-files-found: error
          retention-days: 1
      - name: Commit verified L2 retention
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/kicad_pcb/refinement/quality.py \
            src/kicad_pcb_web/services/schematic_refinement.py \
            tests/unit/test_refinement_quality.py \
            tests/web/test_web_schematic_refinement.py \
            tests/web/test_web_schematic_refinement_loop.py
          git commit -m 'feat: retain deterministic best-known refinement state'
          git push origin HEAD:webapp
