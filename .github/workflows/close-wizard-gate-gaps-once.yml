name: Close Wizard Gate Gaps Once

# One-shot migration helper. Remove after source commit. Rerun 2.
on:
  push:
    branches:
      - webapp
    paths:
      - '.github/workflows/close-wizard-gate-gaps-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: webapp
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra web
      - name: Apply backend wizard gate hardening
        run: python .github/scripts/close_wizard_gate_gaps_once.py
      - name: Normalize and validate touched Python
        run: |
          uv run ruff check --fix src/kicad_pcb_web/services/wizard.py tests/web/test_web_wizard_gate_hardening.py
          uv run ruff format src/kicad_pcb_web/services/wizard.py tests/web/test_web_wizard_gate_hardening.py
          uv run mypy src/kicad_pcb_web
          uv run pytest -q tests/web/test_web_wizard_gate_hardening.py
      - name: Commit hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/kicad_pcb_web/services/wizard.py tests/web/test_web_wizard_gate_hardening.py
          git diff --cached --check
          git commit -m 'fix: enforce backend wizard readiness gates'
          git push origin HEAD:webapp
