name: RESTART1 Bootstrap

on:
  pull_request:
    branches: [webapp]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-payload:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Detect complete payload
        id: payload
        run: |
          if test -f .restart1/READY; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Payload is not complete yet; refusing to apply it."
          fi

      - name: Reconstruct and verify payload
        if: steps.payload.outputs.ready == 'true'
        run: |
          test -f .restart1/manifest.sha256
          test -n "$(find .restart1 -maxdepth 1 -name 'chunk-*' -print -quit)"
          cat .restart1/chunk-* > /tmp/restart1-payload.b64
          base64 --decode /tmp/restart1-payload.b64 > /tmp/restart1-payload.tar.gz
          EXPECTED="$(cut -d' ' -f1 .restart1/manifest.sha256)"
          ACTUAL="$(sha256sum /tmp/restart1-payload.tar.gz | cut -d' ' -f1)"
          test "$ACTUAL" = "$EXPECTED"
          gzip -t /tmp/restart1-payload.tar.gz

      - name: Apply RESTART1 implementation
        if: steps.payload.outputs.ready == 'true'
        run: |
          tar -xzf /tmp/restart1-payload.tar.gz -C .
          rm -rf code_review/archive/2026-06-09/generated
          rm -rf .restart1
          rm -f .github/workflows/restart1-bootstrap.yml

      - name: Commit implementation
        if: steps.payload.outputs.ready == 'true'
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Implement RESTART1 hardening pass"
          git push origin "HEAD:${HEAD_BRANCH}"
