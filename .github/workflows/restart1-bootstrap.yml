name: RESTART1 Bootstrap

on:
  pull_request:
    branches: [webapp]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-payload:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply RESTART1 implementation
        run: |
          test -f .restart1/payload.tar.gz
          tar -xzf .restart1/payload.tar.gz -C .
          rm -rf code_review/archive/2026-06-09/generated
          rm -rf .restart1
          rm -f .github/workflows/restart1-bootstrap.yml
      - name: Commit implementation
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Implement RESTART1 hardening pass"
          git push origin "HEAD:${HEAD_BRANCH}"
