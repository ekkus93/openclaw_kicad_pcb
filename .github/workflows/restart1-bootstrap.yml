name: RESTART1 Bootstrap

on:
  pull_request:
    branches: [webapp]

permissions:
  contents: read

jobs:
  diagnose-payload:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Capture Git and payload metadata
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            if test -f .restart1/payload.tar.gz; then
              echo "payload_size=$(stat -c %s .restart1/payload.tar.gz)"
              echo "payload_sha256=$(sha256sum .restart1/payload.tar.gz | awk '{print $1}')"
              if gzip -t .restart1/payload.tar.gz; then
                echo "payload_gzip=valid"
              else
                echo "payload_gzip=invalid"
              fi
            else
              echo "payload=missing"
            fi
          } > /tmp/restart1-git-metadata.txt
          cat /tmp/restart1-git-metadata.txt
      - name: Upload Git metadata
        uses: actions/upload-artifact@v6
        with:
          name: restart1-git-metadata
          path: /tmp/restart1-git-metadata.txt
          retention-days: 1
