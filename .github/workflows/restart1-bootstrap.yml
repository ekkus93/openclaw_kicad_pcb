name: RESTART1 Bootstrap

on:
  pull_request:
    branches: [webapp]

permissions:
  contents: write
  pull-requests: read
  issues: write

jobs:
  apply-payload:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Detect complete payload
        id: payload
        run: |
          if test -f .restart1/READY; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Payload is not complete yet; refusing to apply it."
          fi

      - name: Reconstruct and verify payload comments
        if: steps.payload.outputs.ready == 'true'
        run: |
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            > /tmp/restart1-comments.json
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import re
          from pathlib import Path

          pages = json.loads(Path('/tmp/restart1-comments.json').read_text())
          comments = [comment for page in pages for comment in page]
          chunk_pattern = re.compile(
              r'<!-- RESTART1_CHUNK:(\d{3}) -->\n(.*?)\n<!-- END_RESTART1_CHUNK -->',
              re.DOTALL,
          )
          manifest_pattern = re.compile(
              r'<!-- RESTART1_MANIFEST -->\n([0-9a-f]{64})\n<!-- END_RESTART1_MANIFEST -->'
          )

          chunks: dict[int, str] = {}
          expected_sha: str | None = None
          for comment in comments:
              body = comment.get('body') or ''
              for match in chunk_pattern.finditer(body):
                  index = int(match.group(1))
                  chunks.setdefault(index, ''.join(match.group(2).split()))
              manifest_match = manifest_pattern.search(body)
              if manifest_match and expected_sha is None:
                  expected_sha = manifest_match.group(1)

          expected_indices = list(range(15))
          if sorted(chunks) != expected_indices:
              raise SystemExit(
                  f'expected chunks {expected_indices}, found {sorted(chunks)}'
              )
          if expected_sha is None:
              raise SystemExit('RESTART1 manifest is missing')

          encoded = ''.join(chunks[index] for index in expected_indices)
          payload = base64.b64decode(encoded, validate=True)
          actual_sha = hashlib.sha256(payload).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(
                  f'payload checksum mismatch: expected {expected_sha}, got {actual_sha}'
              )
          Path('/tmp/restart1-payload.tar.gz').write_bytes(payload)
          PY
          gzip -t /tmp/restart1-payload.tar.gz

      - name: Apply RESTART1 implementation
        if: steps.payload.outputs.ready == 'true'
        run: |
          tar -xzf /tmp/restart1-payload.tar.gz -C .
          rm -rf code_review/archive/2026-06-09/generated
          rm -rf .restart1
          rm -f .github/workflows/restart1-bootstrap.yml

      - name: Commit implementation
        if: steps.payload.outputs.ready == 'true'
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Implement RESTART1 hardening pass"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Remove transport comments
        if: steps.payload.outputs.ready == 'true'
        run: |
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            > /tmp/restart1-comments.json
          python - <<'PY' > /tmp/restart1-comment-ids
          import json
          from pathlib import Path

          pages = json.loads(Path('/tmp/restart1-comments.json').read_text())
          for page in pages:
              for comment in page:
                  body = comment.get('body') or ''
                  if 'RESTART1_CHUNK:' in body or 'RESTART1_MANIFEST' in body:
                      print(comment['id'])
          PY
          while read -r comment_id; do
            test -n "$comment_id" || continue
            gh api --method DELETE \
              "repos/${REPOSITORY}/issues/comments/${comment_id}"
          done < /tmp/restart1-comment-ids
