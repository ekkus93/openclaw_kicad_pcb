name: RESTART1 Direct Apply

on:
  pull_request:
    branches: [webapp]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 0298a9f3f3139367a3e437a0464ed2eb18c3a07f
      EXPECTED_WEBAPP_HEAD: a547c3f95e7d86f63d0211d92feaca26632fbbb6
      EXPECTED_PAYLOAD_SHA256: 6374147fa46ba6d0acbffeed09e066a889759dce725e21dcff415c5cbfc9e6bb
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify payload
        run: |
          set -euo pipefail
          test "$(cat .restart1-direct/READY)" = "${EXPECTED_PAYLOAD_SHA256}"
          : >/tmp/restart1-payload.b64
          for path in \
            p1-0.b64 \
            p1-1.b64 \
            p1-2.b64 \
            p1-3.b64 \
            p1-4a.b64 \
            p1-4b.b64 \
            p1-5.b64 \
            payload-2a.b64 \
            tail-0.b64 \
            tail-1.b64 \
            tail-2.b64 \
            tail-3.b64; do
            cat ".restart1-direct/${path}" >>/tmp/restart1-payload.b64
          done
          base64 --decode /tmp/restart1-payload.b64 >/tmp/restart1-payload.tar.gz
          test "$(sha256sum /tmp/restart1-payload.tar.gz | cut -d' ' -f1)" = "${EXPECTED_PAYLOAD_SHA256}"
          gzip -t /tmp/restart1-payload.tar.gz

      - name: Build clean implementation commit
        run: |
          set -euo pipefail
          git fetch origin webapp
          test "$(git rev-parse origin/webapp)" = "${EXPECTED_WEBAPP_HEAD}"
          git checkout --detach "${BASE_SHA}"
          tar -xzf /tmp/restart1-payload.tar.gz -C .
          while IFS= read -r path; do
            test -n "${path}"
            case "${path}" in
              /*|*'..'*) echo "Unsafe deletion path: ${path}" >&2; exit 1 ;;
            esac
            rm -rf -- "${path}"
          done <.restart1-delete-paths
          rm -f .restart1-delete-paths
          test ! -e .github/workflows/restart1-direct-apply.yml
          test ! -e .github/workflows/restart1-bootstrap.yml
          test ! -e .restart1
          test ! -e .restart1-direct
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Implement RESTART1 hardening pass'

      - name: Update webapp
        run: |
          set -euo pipefail
          git push \
            --force-with-lease="refs/heads/webapp:${EXPECTED_WEBAPP_HEAD}" \
            origin HEAD:refs/heads/webapp
