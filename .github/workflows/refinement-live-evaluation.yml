name: Phase N3 Live Evaluation

run-name: N3 live eval / ${{ github.event_name }} / ${{ github.ref_name }}

on:
  push:
    branches:
      - n3-eval-run
  workflow_dispatch:
    inputs:
      provider:
        description: Vision-capable provider family
        required: true
        default: ollama
        type: choice
        options:
          - ollama
          - llama_server
          - openai
      model:
        description: Explicit provider model identifier
        required: true
        default: qwen3-vl:8b-instruct-n3-64k
        type: string
      base_url:
        description: Required for llama_server/ollama; optional OpenAI-compatible override
        required: false
        default: "http://127.0.0.1:11434"
        type: string
      confirm_12_fixture_live_run:
        description: Confirm real model calls across all 12 Phase N3 fixtures
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: phase-n3-live-evaluation
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  KICAD_SYMBOLS_DIR: /usr/share/kicad/symbols
  AUTO_PROVIDER: "ollama"
  AUTO_MODEL: "qwen3-vl:8b-instruct-n3-64k"
  AUTO_BASE_URL: "http://127.0.0.1:11434"
  N3_OLLAMA_SOURCE_MODEL: "qwen3-vl:8b-instruct"
  N3_OLLAMA_MODEL: "qwen3-vl:8b-instruct-n3-64k"
  N3_OLLAMA_NUM_CTX: "65536"
  KICAD_PCB_WEB_LLM_VISION_ENABLED: "true"
  KICAD_PCB_WEB_LLM_TIMEOUT_S: "300"
  KICAD_PCB_WEB_LLM_ENABLE_STREAMING: "false"
  KICAD_PCB_WEB_LLM_REQUEST_LOG_REDACTION: "true"
  KICAD_PCB_WEB_LLM_DEBUG_ARTIFACT_CAPTURE: "false"
  KICAD_WEBAPP_REFINEMENT_ENABLED: "true"

jobs:
  evaluate:
    name: Run 12-fixture model-directed evaluation
    runs-on: self-hosted
    timeout-minutes: 240
    env:
      EVAL_CONFIRM: ${{ inputs.confirm_12_fixture_live_run }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve live evaluation configuration
        shell: bash
        env:
          MANUAL_PROVIDER: ${{ inputs.provider }}
          MANUAL_MODEL: ${{ inputs.model }}
          MANUAL_BASE_URL: ${{ inputs.base_url }}
          EVAL_API_KEY: ${{ secrets.KICAD_PCB_REFINEMENT_LLM_API_KEY }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/n3-eval-run" ]]; then
              echo "Automated live evaluation is permitted only from n3-eval-run." >&2
              exit 2
            fi
            provider="$AUTO_PROVIDER"
            model="$AUTO_MODEL"
            base_url="$AUTO_BASE_URL"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/webapp" ]]; then
              echo "Manual live evaluation is permitted only from the webapp branch." >&2
              exit 2
            fi
            if [[ "$EVAL_CONFIRM" != "true" ]]; then
              echo "confirm_12_fixture_live_run must be enabled for a manual live experiment." >&2
              exit 2
            fi
            provider="$MANUAL_PROVIDER"
            model="$MANUAL_MODEL"
            base_url="$MANUAL_BASE_URL"
          else
            echo "Unsupported Phase N3 live-evaluation trigger: $GITHUB_EVENT_NAME" >&2
            exit 2
          fi
          if [[ -z "$model" ]]; then
            echo "A model identifier is required." >&2
            exit 2
          fi
          if [[ "$provider" == "openai" ]]; then
            if [[ -z "${EVAL_API_KEY:-}" ]]; then
              echo "Repository secret KICAD_PCB_REFINEMENT_LLM_API_KEY is required for openai." >&2
              exit 2
            fi
          elif [[ -z "$base_url" ]]; then
            echo "base_url is required for llama_server and ollama." >&2
            exit 2
          fi
          echo "KICAD_PCB_WEB_LLM_PROVIDER=$provider" >> "$GITHUB_ENV"
          echo "KICAD_PCB_WEB_LLM_MODEL=$model" >> "$GITHUB_ENV"
          echo "EVAL_BASE_URL=$base_url" >> "$GITHUB_ENV"

      - name: Reuse persistent uv cache
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="${XDG_CACHE_HOME:-$HOME/.cache}/openclaw-kicad-pcb/uv/refinement-live-evaluation"
          mkdir -p "$cache_dir"
          echo "UV_CACHE_DIR=$cache_dir" >> "$GITHUB_ENV"

      - name: Verify preprovisioned KiCad toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v dot >/dev/null
          command -v kicad-cli >/dev/null
          KICAD_VERSION="$(kicad-cli version)"
          [[ "$KICAD_VERSION" == 9.* ]]
          test -d "$KICAD_SYMBOLS_DIR"
          echo "Graphviz: $(command -v dot)"
          echo "KiCad: $KICAD_VERSION"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Sync locked dependencies
        run: uv sync --frozen --extra dev --extra web

      - name: Verify Ollama N3 vision capability
        if: env.KICAD_PCB_WEB_LLM_PROVIDER == 'ollama'
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --base-url "$EVAL_BASE_URL"
            --model "$KICAD_PCB_WEB_LLM_MODEL"
            --probe-width 1260
            --probe-height 891
          )
          if [[ "$KICAD_PCB_WEB_LLM_MODEL" == "$N3_OLLAMA_MODEL" ]]; then
            args+=(
              --source-model "$N3_OLLAMA_SOURCE_MODEL"
              --num-ctx "$N3_OLLAMA_NUM_CTX"
            )
          fi
          uv run python scripts/preflight_n3_ollama.py "${args[@]}"

      - name: Prepare unique evidence paths
        shell: bash
        run: |
          set -euo pipefail
          run_root="$RUNNER_TEMP/phase-n3-live-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          output_root="$run_root/evidence"
          work_root="$run_root/work"
          data_root="$run_root/web-data"
          mkdir -p "$run_root" "$output_root" "$work_root" "$data_root"
          echo "N3_RUN_ROOT=$run_root" >> "$GITHUB_ENV"
          echo "N3_OUTPUT_ROOT=$output_root" >> "$GITHUB_ENV"
          echo "N3_WORK_ROOT=$work_root" >> "$GITHUB_ENV"
          echo "KICAD_PCB_WEB_DATA_DIR=$data_root" >> "$GITHUB_ENV"

      - name: Run Phase N3 full corpus
        shell: bash
        env:
          KICAD_PCB_WEB_LLM_API_KEY: ${{ secrets.KICAD_PCB_REFINEMENT_LLM_API_KEY }}
        run: |
          set -euo pipefail
          set -o pipefail
          if [[ -n "$EVAL_BASE_URL" ]]; then
            export KICAD_PCB_WEB_LLM_BASE_URL="$EVAL_BASE_URL"
          fi
          uv run kicad-refine-eval \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest tests/fixtures/refinement/evaluation_corpus/manifest.json \
            --expectations tests/fixtures/refinement/evaluation_corpus/baseline_expectations.json \
            --output-root "$N3_OUTPUT_ROOT" \
            --work-root "$N3_WORK_ROOT" \
            --implementation-sha "$GITHUB_SHA" \
            --max-rounds 3 \
            --max-operations-per-round 4 \
            --max-total-accepted-operations 8 \
            --max-candidate-rejections 2 \
            --max-critic-repairs 0 \
            --max-planner-repairs 0 \
            2>&1 | tee "$N3_RUN_ROOT/evaluation.log"

      - name: Validate complete 12-fixture evidence
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["N3_OUTPUT_ROOT"]).resolve()

          def read_json(path: Path, label: str) -> dict[str, object]:
              if not path.is_file():
                  raise SystemExit(f"Missing {label}: {path}")
              payload = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(payload, dict):
                  raise SystemExit(f"{label} is not a JSON object: {path}")
              return payload

          def require_mapping(value: object, label: str) -> dict[str, object]:
              if not isinstance(value, dict):
                  raise SystemExit(f"{label} is not an object")
              return value

          def require_file(bundle: Path, relative: object, label: str) -> Path:
              if not isinstance(relative, str) or not relative:
                  raise SystemExit(f"{label} does not contain a relative file path")
              relative_path = Path(relative)
              if relative_path.is_absolute() or ".." in relative_path.parts:
                  raise SystemExit(f"{label} contains an unsafe path: {relative}")
              path = (bundle / relative_path).resolve()
              if bundle != path and bundle not in path.parents:
                  raise SystemExit(f"{label} escapes its fixture bundle: {relative}")
              if not path.is_file():
                  raise SystemExit(f"Missing {label}: {relative}")
              return path

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          summary = read_json(root / "summary.json", "Phase N3 summary")
          fixture_ids = summary.get("fixture_ids")
          results = summary.get("results")
          if summary.get("phase") != "N3" or summary.get("status") != "completed":
              raise SystemExit("Phase N3 summary is not completed")
          if summary.get("implementation_sha") != os.environ["GITHUB_SHA"]:
              raise SystemExit("Phase N3 summary is not bound to the workflow implementation SHA")
          if summary.get("provider") != os.environ["KICAD_PCB_WEB_LLM_PROVIDER"]:
              raise SystemExit("Phase N3 summary provider does not match the configured provider")
          if summary.get("model") != os.environ["KICAD_PCB_WEB_LLM_MODEL"]:
              raise SystemExit("Phase N3 summary model does not match the configured model")
          if summary.get("fixture_count") != 12 or not isinstance(fixture_ids, list):
              raise SystemExit("Phase N3 summary does not contain exactly 12 fixtures")
          if (
              len(fixture_ids) != 12
              or len(set(fixture_ids)) != 12
              or any(not isinstance(item, str) or not item for item in fixture_ids)
          ):
              raise SystemExit("Phase N3 fixture IDs are missing, invalid, or duplicated")
          if not isinstance(results, list) or len(results) != 12:
              raise SystemExit("Phase N3 summary does not contain exactly 12 result records")

          result_by_id: dict[str, dict[str, object]] = {}
          for item in results:
              result = require_mapping(item, "Phase N3 result record")
              fixture_id = result.get("fixture_id")
              if not isinstance(fixture_id, str) or not fixture_id:
                  raise SystemExit("Phase N3 result record has an invalid fixture_id")
              if fixture_id in result_by_id:
                  raise SystemExit(f"Duplicate Phase N3 result record: {fixture_id}")
              result_by_id[fixture_id] = result
          if set(result_by_id) != set(fixture_ids):
              raise SystemExit("Phase N3 result records do not match the fixture ID set")

          for fixture_id in fixture_ids:
              result = result_by_id[fixture_id]
              bundle = (root / fixture_id).resolve()
              if not bundle.is_dir() or root not in bundle.parents:
                  raise SystemExit(f"Missing or unsafe Phase N3 evidence bundle: {fixture_id}")
              if result.get("bundle") != fixture_id:
                  raise SystemExit(f"Summary bundle binding mismatch: {fixture_id}")

              manifest = read_json(bundle / "manifest.json", f"{fixture_id} manifest")
              if manifest.get("phase") != "N3" or manifest.get("fixture_id") != fixture_id:
                  raise SystemExit(f"Invalid Phase N3 fixture manifest: {fixture_id}")
              if manifest.get("isolation_policy") != (
                  "each mode starts from identical baseline schematic bytes"
              ):
                  raise SystemExit(f"Invalid mode-isolation policy: {fixture_id}")
              if manifest.get("baseline_schematic_sha256") != result.get("baseline_hash"):
                  raise SystemExit(f"Baseline hash binding mismatch: {fixture_id}")
              if manifest.get("final_accepted_hash") != result.get("final_accepted_hash"):
                  raise SystemExit(f"Final accepted hash binding mismatch: {fixture_id}")
              if manifest.get("final_electrical_status") != "passed":
                  raise SystemExit(f"Final electrical invariance did not pass: {fixture_id}")
              if manifest.get("stop_reason") != result.get("refine_stop_reason"):
                  raise SystemExit(f"Refine stop-reason binding mismatch: {fixture_id}")

              baseline_path = bundle / "baseline" / "accepted.kicad_sch"
              if not baseline_path.is_file() or sha256(baseline_path) != result.get("baseline_hash"):
                  raise SystemExit(f"Baseline schematic bytes do not match summary: {fixture_id}")

              analyze = require_mapping(manifest.get("analyze"), f"{fixture_id} analyze")
              plan = require_mapping(manifest.get("plan"), f"{fixture_id} plan")
              apply_once = require_mapping(manifest.get("apply_once"), f"{fixture_id} apply_once")
              refine = require_mapping(manifest.get("refine"), f"{fixture_id} refine")
              before_after = require_mapping(
                  manifest.get("before_after"), f"{fixture_id} before_after"
              )
              before_render = require_mapping(
                  before_after.get("before_render"), f"{fixture_id} before render"
              )
              after_render = require_mapping(
                  before_after.get("after_render"), f"{fixture_id} after render"
              )
              analyze_render = require_mapping(
                  analyze.get("render"), f"{fixture_id} analyze render"
              )
              refine_render = require_mapping(
                  refine.get("after_render"), f"{fixture_id} refine render"
              )
              if before_render.get("png") != analyze_render.get("png"):
                  raise SystemExit(f"Before-render binding mismatch: {fixture_id}")
              if after_render.get("png") != refine_render.get("png"):
                  raise SystemExit(f"After-render binding mismatch: {fixture_id}")

              require_file(bundle, analyze.get("result"), f"{fixture_id} analyze result")
              require_file(bundle, plan.get("result"), f"{fixture_id} plan result")
              require_file(bundle, before_render.get("png"), f"{fixture_id} before render PNG")
              require_file(bundle, after_render.get("png"), f"{fixture_id} after render PNG")
              operations_path = require_file(
                  bundle, manifest.get("operations"), f"{fixture_id} operation record"
              )
              operations = read_json(operations_path, f"{fixture_id} operation record")
              if not isinstance(operations.get("apply_once"), dict) or not isinstance(
                  operations.get("refine"), list
              ):
                  raise SystemExit(f"Invalid operation record shape: {fixture_id}")

              apply_result_path = require_file(
                  bundle, apply_once.get("result"), f"{fixture_id} apply_once result"
              )
              apply_electrical_path = require_file(
                  bundle,
                  apply_once.get("final_electrical"),
                  f"{fixture_id} apply_once electrical result",
              )
              apply_metrics_path = require_file(
                  bundle,
                  apply_once.get("final_metrics"),
                  f"{fixture_id} apply_once metrics",
              )
              apply_schematic = require_file(
                  bundle,
                  apply_once.get("final_schematic"),
                  f"{fixture_id} apply_once final schematic",
              )
              apply_result = read_json(apply_result_path, f"{fixture_id} apply_once result")
              apply_electrical = read_json(
                  apply_electrical_path, f"{fixture_id} apply_once electrical result"
              )
              apply_metrics = read_json(apply_metrics_path, f"{fixture_id} apply_once metrics")
              apply_hash = sha256(apply_schematic)
              if apply_once.get("status") != result.get("apply_once_status") or apply_once.get(
                  "code"
              ) != result.get("apply_once_code"):
                  raise SystemExit(f"Apply-once summary binding mismatch: {fixture_id}")
              if apply_result.get("status") != apply_once.get("status") or apply_result.get(
                  "code"
              ) != apply_once.get("code"):
                  raise SystemExit(f"Apply-once result binding mismatch: {fixture_id}")
              if apply_result.get("accepted_hash_after") != apply_hash:
                  raise SystemExit(f"Apply-once final schematic hash mismatch: {fixture_id}")
              if apply_electrical.get("status") != "passed" or apply_electrical.get(
                  "candidate_schematic_hash"
              ) != apply_hash:
                  raise SystemExit(f"Apply-once electrical evidence mismatch: {fixture_id}")
              if apply_metrics.get("schematic_hash") != apply_hash:
                  raise SystemExit(f"Apply-once metric hash mismatch: {fixture_id}")

              refine_result_path = require_file(
                  bundle, refine.get("result"), f"{fixture_id} refine result"
              )
              refine_electrical_path = require_file(
                  bundle,
                  refine.get("final_electrical"),
                  f"{fixture_id} refine electrical result",
              )
              refine_metrics_path = require_file(
                  bundle, refine.get("final_metrics"), f"{fixture_id} refine metrics"
              )
              refine_schematic = require_file(
                  bundle,
                  refine.get("final_schematic"),
                  f"{fixture_id} refine final schematic",
              )
              refine_result = read_json(refine_result_path, f"{fixture_id} refine result")
              refine_electrical = read_json(
                  refine_electrical_path, f"{fixture_id} refine electrical result"
              )
              refine_metrics = read_json(refine_metrics_path, f"{fixture_id} refine metrics")
              refine_hash = sha256(refine_schematic)
              if refine.get("status") != result.get("refine_status") or refine.get(
                  "stop_reason"
              ) != result.get("refine_stop_reason"):
                  raise SystemExit(f"Refine summary binding mismatch: {fixture_id}")
              if refine_result.get("status") != refine.get("status") or refine_result.get(
                  "stop_reason"
              ) != refine.get("stop_reason"):
                  raise SystemExit(f"Refine result binding mismatch: {fixture_id}")
              if refine_result.get("final_accepted_hash") != refine_hash:
                  raise SystemExit(f"Refine final schematic hash mismatch: {fixture_id}")
              if refine_electrical.get("status") != "passed" or refine_electrical.get(
                  "candidate_schematic_hash"
              ) != refine_hash:
                  raise SystemExit(f"Refine electrical evidence mismatch: {fixture_id}")
              if refine_metrics.get("schematic_hash") != refine_hash:
                  raise SystemExit(f"Refine metric hash mismatch: {fixture_id}")
              if refine_hash != result.get("final_accepted_hash"):
                  raise SystemExit(f"Refine hash does not match corpus summary: {fixture_id}")

          print("Validated 12 complete, hash-bound Phase N3 evidence bundles")
          PY

      - name: Upload Phase N3 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase-n3-live-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/phase-n3-live-${{ github.run_id }}-${{ github.run_attempt }}/evidence
            ${{ runner.temp }}/phase-n3-live-${{ github.run_id }}-${{ github.run_attempt }}/evaluation.log
          if-no-files-found: warn
          retention-days: 30
