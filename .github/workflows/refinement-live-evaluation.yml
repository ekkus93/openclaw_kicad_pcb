name: Phase N3 Live Evaluation

run-name: N3 live eval / ${{ github.event_name }} / ${{ github.ref_name }}

on:
  push:
    branches:
      - n3-eval-run
  workflow_dispatch:
    inputs:
      provider:
        description: Vision-capable provider family
        required: true
        default: ollama
        type: choice
        options:
          - ollama
          - llama_server
          - openai
      model:
        description: Explicit provider model identifier
        required: true
        default: qwen3-vl:8b-instruct
        type: string
      base_url:
        description: Required for llama_server/ollama; optional OpenAI-compatible override
        required: false
        default: "http://127.0.0.1:11434"
        type: string
      confirm_12_fixture_live_run:
        description: Confirm real model calls across all 12 Phase N3 fixtures
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: phase-n3-live-evaluation
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  KICAD_SYMBOLS_DIR: /usr/share/kicad/symbols
  AUTO_PROVIDER: "ollama"
  AUTO_MODEL: "qwen3-vl:8b-instruct"
  AUTO_BASE_URL: "http://127.0.0.1:11434"
  KICAD_PCB_WEB_LLM_VISION_ENABLED: "true"
  KICAD_PCB_WEB_LLM_TIMEOUT_S: "180"
  KICAD_PCB_WEB_LLM_ENABLE_STREAMING: "false"
  KICAD_PCB_WEB_LLM_REQUEST_LOG_REDACTION: "true"
  KICAD_PCB_WEB_LLM_DEBUG_ARTIFACT_CAPTURE: "false"
  KICAD_WEBAPP_REFINEMENT_ENABLED: "true"

jobs:
  evaluate:
    name: Run 12-fixture model-directed evaluation
    runs-on: self-hosted
    timeout-minutes: 240
    env:
      EVAL_CONFIRM: ${{ inputs.confirm_12_fixture_live_run }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve live evaluation configuration
        shell: bash
        env:
          MANUAL_PROVIDER: ${{ inputs.provider }}
          MANUAL_MODEL: ${{ inputs.model }}
          MANUAL_BASE_URL: ${{ inputs.base_url }}
          EVAL_API_KEY: ${{ secrets.KICAD_PCB_REFINEMENT_LLM_API_KEY }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/n3-eval-run" ]]; then
              echo "Automated live evaluation is permitted only from n3-eval-run." >&2
              exit 2
            fi
            provider="$AUTO_PROVIDER"
            model="$AUTO_MODEL"
            base_url="$AUTO_BASE_URL"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/webapp" ]]; then
              echo "Manual live evaluation is permitted only from the webapp branch." >&2
              exit 2
            fi
            if [[ "$EVAL_CONFIRM" != "true" ]]; then
              echo "confirm_12_fixture_live_run must be enabled for a manual live experiment." >&2
              exit 2
            fi
            provider="$MANUAL_PROVIDER"
            model="$MANUAL_MODEL"
            base_url="$MANUAL_BASE_URL"
          else
            echo "Unsupported Phase N3 live-evaluation trigger: $GITHUB_EVENT_NAME" >&2
            exit 2
          fi
          if [[ -z "$model" ]]; then
            echo "A model identifier is required." >&2
            exit 2
          fi
          if [[ "$provider" == "openai" ]]; then
            if [[ -z "${EVAL_API_KEY:-}" ]]; then
              echo "Repository secret KICAD_PCB_REFINEMENT_LLM_API_KEY is required for openai." >&2
              exit 2
            fi
          elif [[ -z "$base_url" ]]; then
            echo "base_url is required for llama_server and ollama." >&2
            exit 2
          fi
          echo "KICAD_PCB_WEB_LLM_PROVIDER=$provider" >> "$GITHUB_ENV"
          echo "KICAD_PCB_WEB_LLM_MODEL=$model" >> "$GITHUB_ENV"
          echo "EVAL_BASE_URL=$base_url" >> "$GITHUB_ENV"

      - name: Reuse persistent uv cache
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="${XDG_CACHE_HOME:-$HOME/.cache}/openclaw-kicad-pcb/uv/refinement-live-evaluation"
          mkdir -p "$cache_dir"
          echo "UV_CACHE_DIR=$cache_dir" >> "$GITHUB_ENV"

      - name: Verify preprovisioned KiCad toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v dot >/dev/null
          command -v kicad-cli >/dev/null
          KICAD_VERSION="$(kicad-cli version)"
          [[ "$KICAD_VERSION" == 9.* ]]
          test -d "$KICAD_SYMBOLS_DIR"
          echo "Graphviz: $(command -v dot)"
          echo "KiCad: $KICAD_VERSION"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Sync locked dependencies
        run: uv sync --frozen --extra dev --extra web

      - name: Verify Ollama model and structured chat capability
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$KICAD_PCB_WEB_LLM_PROVIDER" != "ollama" ]]; then
            exit 0
          fi
          export EVAL_BASE_URL KICAD_PCB_WEB_LLM_MODEL
          uv run python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base_url = os.environ["EVAL_BASE_URL"].rstrip("/")
          model = os.environ["KICAD_PCB_WEB_LLM_MODEL"]

          def provider_error(exc: urllib.error.HTTPError) -> str:
              try:
                  raw = exc.read(4096).decode("utf-8", errors="replace")
                  payload = json.loads(raw)
              except (OSError, UnicodeError, json.JSONDecodeError):
                  return "unavailable"
              if not isinstance(payload, dict):
                  return "unavailable"
              error = payload.get("error")
              if isinstance(error, str):
                  return error[:500]
              if isinstance(error, dict) and isinstance(error.get("message"), str):
                  return str(error["message"])[:500]
              return "unavailable"

          def get_json(path: str, *, timeout: float = 10.0) -> dict[str, object]:
              try:
                  with urllib.request.urlopen(f"{base_url}{path}", timeout=timeout) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as exc:
                  raise SystemExit(
                      f"Unable to query Ollama {path}: "
                      f"HTTP {exc.code}; error={provider_error(exc)!r}"
                  ) from exc
              except (OSError, urllib.error.URLError, json.JSONDecodeError) as exc:
                  raise SystemExit(
                      f"Unable to query Ollama {path} at {base_url}: {type(exc).__name__}"
                  ) from exc
              if not isinstance(payload, dict):
                  raise SystemExit(f"Ollama {path} returned a non-object JSON payload")
              return payload

          def post_json(
              path: str,
              payload: dict[str, object],
              *,
              timeout: float,
              operation: str,
          ) -> dict[str, object]:
              request = urllib.request.Request(
                  f"{base_url}{path}",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as exc:
                  raise SystemExit(
                      f"{operation} failed: HTTP {exc.code}; error={provider_error(exc)!r}"
                  ) from exc
              except (OSError, urllib.error.URLError, json.JSONDecodeError) as exc:
                  raise SystemExit(f"{operation} failed: {type(exc).__name__}") from exc
              if not isinstance(result, dict):
                  raise SystemExit(f"{operation} returned non-object JSON")
              return result

          def installed_models() -> set[str]:
              tags = get_json("/api/tags")
              models = tags.get("models")
              if not isinstance(models, list):
                  raise SystemExit("Ollama /api/tags response does not contain a model list")
              return {
                  str(item.get("name") or item.get("model"))
                  for item in models
                  if isinstance(item, dict) and (item.get("name") or item.get("model"))
              }

          version_payload = get_json("/api/version")
          version = version_payload.get("version")
          print(f"Ollama version: {version if isinstance(version, str) else 'unknown'}")

          installed = installed_models()
          if model not in installed:
              print(f"Ollama model {model!r} is not installed; pulling it once for this runner.")
              post_json(
                  "/api/pull",
                  {"model": model, "stream": False},
                  timeout=3600,
                  operation=f"Ollama pull for {model!r}",
              )
              installed = installed_models()
              if model not in installed:
                  raise SystemExit(
                      f"Ollama pull completed but required model {model!r} is still unavailable"
                  )

          chat = post_json(
              "/api/chat",
              {
                  "model": model,
                  "messages": [
                      {
                          "role": "user",
                          "content": 'Return exactly one JSON object: {"ok":true}',
                      }
                  ],
                  "stream": False,
                  "format": "json",
                  "think": False,
                  "options": {"temperature": 0, "num_predict": 128},
              },
              timeout=180,
              operation="Ollama structured chat capability probe",
          )

          message = chat.get("message")
          content = message.get("content") if isinstance(message, dict) else None
          if not isinstance(content, str) or not content.strip():
              thinking = message.get("thinking") if isinstance(message, dict) else None
              thinking_chars = len(thinking) if isinstance(thinking, str) else 0
              raise SystemExit(
                  "Ollama structured chat capability probe returned no usable "
                  f"message.content (thinking_chars={thinking_chars}). "
                  "Use a non-thinking vision model such as qwen3-vl:8b-instruct."
              )
          try:
              parsed = json.loads(content)
          except json.JSONDecodeError as exc:
              raise SystemExit("Ollama structured chat capability probe returned invalid JSON") from exc
          if not isinstance(parsed, dict):
              raise SystemExit("Ollama structured chat capability probe returned non-object content")

          print(f"Ollama model ready for structured chat: {model} at {base_url}")
          PY

      - name: Prepare unique evidence paths
        shell: bash
        run: |
          set -euo pipefail
          run_root="$RUNNER_TEMP/phase-n3-live-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          output_root="$run_root/evidence"
          work_root="$run_root/work"
          data_root="$run_root/web-data"
          mkdir -p "$run_root" "$output_root" "$work_root" "$data_root"
          echo "N3_RUN_ROOT=$run_root" >> "$GITHUB_ENV"
          echo "N3_OUTPUT_ROOT=$output_root" >> "$GITHUB_ENV"
          echo "N3_WORK_ROOT=$work_root" >> "$GITHUB_ENV"
          echo "KICAD_PCB_WEB_DATA_DIR=$data_root" >> "$GITHUB_ENV"

      - name: Run Phase N3 full corpus
        shell: bash
        env:
          KICAD_PCB_WEB_LLM_API_KEY: ${{ secrets.KICAD_PCB_REFINEMENT_LLM_API_KEY }}
        run: |
          set -euo pipefail
          set -o pipefail
          if [[ -n "$EVAL_BASE_URL" ]]; then
            export KICAD_PCB_WEB_LLM_BASE_URL="$EVAL_BASE_URL"
          fi
          uv run kicad-refine-eval \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest tests/fixtures/refinement/evaluation_corpus/manifest.json \
            --expectations tests/fixtures/refinement/evaluation_corpus/baseline_expectations.json \
            --output-root "$N3_OUTPUT_ROOT" \
            --work-root "$N3_WORK_ROOT" \
            --implementation-sha "$GITHUB_SHA" \
            --max-rounds 3 \
            --max-operations-per-round 4 \
            --max-total-accepted-operations 8 \
            --max-candidate-rejections 2 \
            --max-critic-repairs 0 \
            --max-planner-repairs 0 \
            2>&1 | tee "$N3_RUN_ROOT/evaluation.log"

      - name: Validate complete 12-fixture evidence
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["N3_OUTPUT_ROOT"])
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          fixture_ids = summary.get("fixture_ids")
          if summary.get("phase") != "N3" or summary.get("status") != "completed":
              raise SystemExit("Phase N3 summary is not completed")
          if summary.get("fixture_count") != 12 or not isinstance(fixture_ids, list):
              raise SystemExit("Phase N3 summary does not contain exactly 12 fixtures")
          if len(fixture_ids) != 12 or len(set(fixture_ids)) != 12:
              raise SystemExit("Phase N3 fixture IDs are missing or duplicated")
          missing = [fixture_id for fixture_id in fixture_ids if not (root / fixture_id).is_dir()]
          if missing:
              raise SystemExit(f"Missing Phase N3 evidence bundle(s): {missing}")
          print("Validated 12 complete Phase N3 evidence bundles")
          PY

      - name: Upload Phase N3 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase-n3-live-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/phase-n3-live-${{ github.run_id }}-${{ github.run_attempt }}/evidence
            ${{ runner.temp }}/phase-n3-live-${{ github.run_id }}-${{ github.run_attempt }}/evaluation.log
          if-no-files-found: warn
          retention-days: 30
