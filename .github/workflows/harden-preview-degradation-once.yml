name: Harden Preview Degradation Once

on:
  push:
    branches:
      - webapp
    paths:
      - '.github/workflows/harden-preview-degradation-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: webapp
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra web
      - name: Narrow preview degraded mode
        run: python .github/scripts/harden_preview_degradation_once.py
      - name: Normalize and validate touched Python
        run: |
          uv run ruff check --fix src/kicad_pcb_web/services/netlists.py tests/unit/test_preview_nonfatal.py
          uv run ruff format src/kicad_pcb_web/services/netlists.py tests/unit/test_preview_nonfatal.py
          uv run pytest -q tests/unit/test_preview_nonfatal.py
      - name: Commit hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/kicad_pcb_web/services/netlists.py tests/unit/test_preview_nonfatal.py
          git diff --cached --check
          git commit -m 'fix: narrow preview degraded mode'
          git push origin HEAD:webapp
