name: Apply Mypy and SPA Sync Once

on:
  push:
    branches:
      - webapp
    paths:
      - '.github/workflows/apply-mypy-spa-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: webapp
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Fix explicit config type narrowing
        run: >-
          python -c 'from pathlib import Path; p=Path("src/kicad_pcb_web/settings.py"); s=p.read_text(encoding="utf-8"); old="    config_path_env = os.environ.get(\"KICAD_PCB_WEB_CONFIG_FILE\")\n    explicit_path = config_path_env is not None\n    if explicit_path and not config_path_env.strip():\n        raise ValueError(\"KICAD_PCB_WEB_CONFIG_FILE must not be empty when explicitly set\")\n\n    config_path = (\n        Path(config_path_env).expanduser().resolve()\n        if explicit_path\n        else Path(\"kicad_pcb_web.toml\").resolve()\n    )\n"; new="    config_path_env = os.environ.get(\"KICAD_PCB_WEB_CONFIG_FILE\")\n    if config_path_env is not None:\n        if not config_path_env.strip():\n            raise ValueError(\"KICAD_PCB_WEB_CONFIG_FILE must not be empty when explicitly set\")\n        config_path = Path(config_path_env).expanduser().resolve()\n        explicit_path = True\n    else:\n        config_path = Path(\"kicad_pcb_web.toml\").resolve()\n        explicit_path = False\n"; assert old in s, "Expected config-path block not found"; p.write_text(s.replace(old,new,1), encoding="utf-8")'
      - name: Rebuild committed SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit exact generated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/kicad_pcb_web/settings.py src/kicad_pcb_web/static/spa
          git diff --cached --check
          git commit -m 'fix: normalize config path and SPA bundle'
          git push origin HEAD:webapp
