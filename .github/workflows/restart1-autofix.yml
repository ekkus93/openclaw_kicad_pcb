name: RESTART1 Lint Diagnostics

on:
  push:
    branches: [webapp]

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: webapp
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen --extra dev --extra web --extra llm

      - name: Capture exact Ruff diagnostics
        run: |
          set -uo pipefail
          mkdir -p docs
          set +e
          uv run ruff check . --output-format=full > docs/RESTART1_RUFF_REMAINING.txt 2>&1
          status=$?
          set -e
          {
            printf '\nRuff exit status: %s\n' "$status"
            printf 'Source commit: %s\n' "${GITHUB_SHA}"
          } >> docs/RESTART1_RUFF_REMAINING.txt

      - name: Commit diagnostics
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/RESTART1_RUFF_REMAINING.txt
          git diff --cached --check
          git commit -m 'Record RESTART1 Ruff diagnostics'
          git push origin HEAD:refs/heads/webapp
