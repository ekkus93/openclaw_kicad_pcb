name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    name: Unit tests, lint & type check
    runs-on: ubuntu-latest
    env:
      KICAD_SYMBOLS_DIR: /usr/share/kicad/symbols

    steps:
      - uses: actions/checkout@v6

      - name: Install unit-test system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y graphviz kicad-symbols

      - name: Verify external toolchain
        run: |
          command -v dot
          test -d "$KICAD_SYMBOLS_DIR"

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # ── Static checks ────────────────────────────────────────────────────────
      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy kicad-pcb/src

      # ── Unit tests with coverage ─────────────────────────────────────────────
      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            --cov \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -v

      # ── Artifacts ────────────────────────────────────────────────────────────
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  integration-tests:
    name: Integration tests (KiCad required)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v6

      # ── Install KiCad ────────────────────────────────────────────────────────
      - name: Add KiCad PPA and install
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update -q
          sudo apt-get install -y graphviz kicad
          DOT_BIN="$(command -v dot)"
          echo "GRAPHVIZ_DOT=$DOT_BIN" >> "$GITHUB_ENV"
          "$DOT_BIN" -V
          kicad-cli version

      # ── Python setup ─────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # ── Integration tests ────────────────────────────────────────────────────
      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            -v \
            --tb=long \
            --junit-xml=integration-results.xml

      # ── Artifacts ────────────────────────────────────────────────────────────
      - name: Upload test results and logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-artifacts-${{ github.run_id }}
          path: |
            integration-results.xml
            /tmp/pytest-*/
          retention-days: 7
