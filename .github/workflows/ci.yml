name: RESTART1 Validate Remaining Fixes

on:
  push:
    branches: [webapp]

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: webapp
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen --extra dev --extra web

      - name: Format and lint
        run: |
          set -euo pipefail
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff check .
          uv run ruff format --check .

      - name: Run affected tests
        run: uv run pytest -q tests/web/test_web_persistence.py tests/web/test_web_wizard.py

      - name: Commit deterministic formatting
        run: |
          set -euo pipefail
          rm -f docs/RESTART1_RUFF_REMAINING.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git restore --staged .github/workflows
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No formatting changes were needed.'
            exit 0
          fi
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --stat
          git commit -m 'Format and validate RESTART1 lint fixes'
          git push origin HEAD:refs/heads/webapp
