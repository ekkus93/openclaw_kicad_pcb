name: RESTART1 Repair Stale Integration Contract

on:
  push:
    branches: [webapp]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: webapp
          fetch-depth: 0
          persist-credentials: true

      - name: Update integration tests for single-file schematic output
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/integration/test_phase0_smoke.py")
          source = path.read_text(encoding="utf-8")

          replacements = (
              (
                  "from kicad_pcb.commands.netlist import MANAGED_SHEET_FILE\n",
                  "",
                  1,
              ),
              (
                  '    """Parse OpenClaw:bind= markers from a managed schematic file.\n',
                  '    """Parse OpenClaw:bind= markers from a generated schematic file.\n',
                  1,
              ),
              (
                  "    - Both commands produce identical pin→net binding markers in the managed\n"
                  "      schematic, confirming deterministic output\n",
                  "    - Both commands produce identical pin→net binding markers in the main\n"
                  "      schematic, confirming deterministic output\n",
                  1,
              ),
              (
                  '        assert (project_dir / MANAGED_SHEET_FILE).exists(), "Managed schematic not created"\n',
                  "",
                  2,
              ),
              (
                  "        generation is deterministic at the managed-schematic level.\n",
                  "        generation is deterministic at the main-schematic level.\n",
                  1,
              ),
              (
                  '        bindings_a = _extract_bindings_from_sch(self.projects_dir / "ProjA" / MANAGED_SHEET_FILE)\n'
                  '        bindings_b = _extract_bindings_from_sch(self.projects_dir / "ProjB" / MANAGED_SHEET_FILE)\n',
                  '        bindings_a = _extract_bindings_from_sch(\n'
                  '            self.projects_dir / "ProjA" / "ProjA.kicad_sch"\n'
                  '        )\n'
                  '        bindings_b = _extract_bindings_from_sch(\n'
                  '            self.projects_dir / "ProjB" / "ProjB.kicad_sch"\n'
                  '        )\n',
                  1,
              ),
          )

          changed = False
          for old, new, expected_count in replacements:
              actual_count = source.count(old)
              if actual_count == 0 and new in source:
                  continue
              if actual_count != expected_count:
                  raise SystemExit(
                      f"unexpected replacement count for {old!r}: "
                      f"expected {expected_count}, found {actual_count}"
                  )
              source = source.replace(old, new)
              changed = True

          if "MANAGED_SHEET_FILE" in source:
              raise SystemExit("stale MANAGED_SHEET_FILE reference remains")

          if changed:
              path.write_text(source, encoding="utf-8")
          PY
          python -m compileall -q tests/integration/test_phase0_smoke.py

      - name: Commit repaired integration contract
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/integration/test_phase0_smoke.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Integration contract is already current.'
            exit 0
          fi
          git diff --cached --stat
          git commit -m 'test: align KiCad integration tests with main schematic output'
          git push origin HEAD:refs/heads/webapp
