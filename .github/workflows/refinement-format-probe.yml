name: Refinement Format Probe

on:
  push:
    branches: [webapp]
    paths:
      - '.github/workflows/refinement-format-probe.yml'

permissions:
  contents: write

jobs:
  format-refinement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Sync formatting toolchain
        run: uv sync --frozen --extra dev
      - name: Format and verify affected files
        run: |
          uv run ruff format \
            src/kicad_pcb/refinement/metrics.py \
            src/kicad_pcb/refinement/operations.py \
            src/kicad_pcb/refinement/page_geometry.py \
            src/kicad_pcb/refinement/quality.py \
            src/kicad_pcb/refinement/validation.py \
            tests/unit/test_refinement_operations.py \
            tests/unit/test_refinement_quality.py \
            tests/unit/test_refinement_rendering.py
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q \
            tests/unit/test_refinement_metrics.py \
            tests/unit/test_refinement_operations.py \
            tests/unit/test_refinement_quality.py \
            tests/unit/test_refinement_rendering.py
          git diff --check
      - name: Commit canonical Ruff formatting
        run: |
          if git diff --quiet; then
            echo 'No formatter changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/kicad_pcb/refinement/metrics.py \
            src/kicad_pcb/refinement/operations.py \
            src/kicad_pcb/refinement/page_geometry.py \
            src/kicad_pcb/refinement/quality.py \
            src/kicad_pcb/refinement/validation.py \
            tests/unit/test_refinement_operations.py \
            tests/unit/test_refinement_quality.py \
            tests/unit/test_refinement_rendering.py
          git commit -m 'style: apply canonical Ruff formatting'
          git push origin HEAD:webapp
