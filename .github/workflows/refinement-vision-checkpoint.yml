name: Refinement Vision Checkpoint

on:
  push:
    branches: [webapp]
    paths:
      - '.github/workflows/refinement-vision-checkpoint.yml'

permissions:
  contents: write

jobs:
  verify-and-checkpoint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Reconstruct exact sandbox checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import binascii
          import hashlib
          import itertools
          import json
          import os
          import tarfile
          import urllib.request
          from pathlib import Path, PurePosixPath

          repo = 'ekkus93/openclaw_kicad_pcb'

          def decode_base64_text(data):
              compact = b''.join(data.split())
              return base64.b64decode(compact, validate=True)

          def resolve_mixed_chunks(chunks, expected):
              choices = []
              for chunk in chunks:
                  options = [('raw', chunk)]
                  try:
                      decoded = decode_base64_text(chunk)
                  except (binascii.Error, ValueError):
                      pass
                  else:
                      if decoded != chunk:
                          options.append(('base64', decoded))
                  choices.append(options)

              matches = []
              for combination in itertools.product(*choices):
                  modes = tuple(mode for mode, _ in combination)
                  archive = b''.join(data for _, data in combination)
                  digest = hashlib.sha256(archive).hexdigest()
                  if digest == expected:
                      matches.append((modes, archive))

              if len(matches) != 1:
                  raise SystemExit(
                      'mixed chunk representation did not resolve uniquely: '
                      f'matches={len(matches)}'
                  )
              modes, archive = matches[0]
              print('resolved_chunk_modes=' + ','.join(modes))
              return archive

          def fetch_archive(blobs, expected, output, *, chunk_mode):
              chunks = []
              for sha in blobs:
                  req = urllib.request.Request(
                      f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                      headers={
                          'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                          'Accept': 'application/vnd.github+json',
                          'X-GitHub-Api-Version': '2022-11-28',
                      },
                  )
                  with urllib.request.urlopen(req) as response:
                      payload = json.load(response)
                  if payload.get('encoding') != 'base64':
                      raise SystemExit(f'unexpected blob encoding for {sha}')
                  chunks.append(base64.b64decode(payload['content']))

              if chunk_mode == 'joined_base64':
                  archive = decode_base64_text(b''.join(chunks))
              elif chunk_mode == 'mixed_sha256':
                  archive = resolve_mixed_chunks(chunks, expected)
              else:
                  raise SystemExit(f'unsupported chunk mode: {chunk_mode}')

              digest = hashlib.sha256(archive).hexdigest()
              if digest != expected:
                  raise SystemExit(f'archive SHA mismatch: {digest}')
              output.write_bytes(archive)
              with tarfile.open(output, 'r:gz') as tf:
                  for member in tf.getmembers():
                      path = PurePosixPath(member.name)
                      if path.is_absolute() or '..' in path.parts:
                          raise SystemExit(f'unsafe archive path: {member.name}')
                  tf.extractall('.')
              print(f'{output.name}_sha256={digest}')

          fetch_archive(
              [
                  '551b944e952cb9267ad825c704c88c5d871c5e55',
                  'e8a4563b11e82a72eb41794c070bf1aedef142ca',
                  'f65b7e153a5efbc6ba663dbff04705f785fe54ac',
                  '53528b0fb7dc40cedb721ff714ca710d4c77f4a1',
                  'ebce0d0180da13b873d03b10b3ed8fa6994ee2bf',
                  '981a3d5e9cd1b84e2559c51dcd7e20cfab412a90',
              ],
              '9a2036c6a892b18fbcee5beb77c1373dfd5911acce989dd62138f69d1f767236',
              Path('/tmp/refinement-vision-checkpoint.tar.gz'),
              chunk_mode='joined_base64',
          )
          fetch_archive(
              [
                  '36090ea8325d5c7901a9015546ca52b0804c215f',
                  '2eb312e5c71e451aacf0c87553079f8e2a56c408',
                  'e31366c6739cc8294bd758a5fad759b82a0b3541',
                  '5ca8b6ca3bba494aa66da5502d89ad75daecb819',
              ],
              'b65e55dc9e526d53526e5315c37549a934fdd7b628f10fc381df44d861ead478',
              Path('/tmp/refinement-vision-delta.tar.gz'),
              chunk_mode='mixed_sha256',
          )
          PY
      - name: Sync locked toolchain
        run: uv sync --frozen --extra dev --extra web
      - name: Canonical format and validate
        run: |
          mapfile -t FILES < <(tar -tzf /tmp/refinement-vision-checkpoint.tar.gz)
          uv run ruff format "${FILES[@]}"
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src/kicad_pcb src/kicad_pcb_web
          uv run pytest -q \
            tests/unit/test_refinement_*.py \
            tests/web/test_web_llm_*.py \
            tests/web/test_web_refinement_llm.py \
            tests/web/test_web_schematic_refinement.py \
            tests/web/test_web_settings.py \
            tests/unit/test_wizard_llm_robustness.py
          git diff --check
      - name: Commit verified vision refinement tranche
        run: |
          mapfile -t FILES < <(tar -tzf /tmp/refinement-vision-checkpoint.tar.gz)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${FILES[@]}"
          git commit -m 'feat: add bounded schematic vision refinement service'
          git push origin HEAD:webapp
