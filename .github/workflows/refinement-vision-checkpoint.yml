name: Refinement Vision Checkpoint

on:
  push:
    branches: [webapp]
    paths:
      - '.github/workflows/refinement-vision-checkpoint.yml'

permissions:
  contents: write

jobs:
  verify-and-checkpoint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Reconstruct exact sandbox checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import tarfile
          import urllib.request
          from pathlib import Path, PurePosixPath

          repo = 'ekkus93/openclaw_kicad_pcb'

          def fetch_archive(blobs, expected, output):
              encoded_chunks = []
              for sha in blobs:
                  req = urllib.request.Request(
                      f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                      headers={
                          'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                          'Accept': 'application/vnd.github+json',
                          'X-GitHub-Api-Version': '2022-11-28',
                      },
                  )
                  with urllib.request.urlopen(req) as response:
                      payload = json.load(response)
                  if payload.get('encoding') != 'base64':
                      raise SystemExit(f'unexpected blob encoding for {sha}')
                  encoded_chunks.append(base64.b64decode(payload['content']))

              encoded = b''.join(encoded_chunks)
              compact = b''.join(encoded.split())
              archive = base64.b64decode(compact, validate=True)
              digest = hashlib.sha256(archive).hexdigest()
              if digest != expected:
                  raise SystemExit(f'archive SHA mismatch: {digest}')
              output.write_bytes(archive)
              with tarfile.open(output, 'r:gz') as tf:
                  for member in tf.getmembers():
                      path = PurePosixPath(member.name)
                      if path.is_absolute() or '..' in path.parts:
                          raise SystemExit(f'unsafe archive path: {member.name}')
                  tf.extractall('.')
              print(f'{output.name}_sha256={digest}')

          def replace_exact(path, old, new, expected_count):
              text = path.read_text(encoding='utf-8')
              actual_count = text.count(old)
              if actual_count != expected_count:
                  raise SystemExit(
                      f'unexpected migration match count for {path}: '
                      f'expected={expected_count} actual={actual_count}'
                  )
              path.write_text(text.replace(old, new), encoding='utf-8')

          fetch_archive(
              [
                  '551b944e952cb9267ad825c704c88c5d871c5e55',
                  'e8a4563b11e82a72eb41794c070bf1aedef142ca',
                  'f65b7e153a5efbc6ba663dbff04705f785fe54ac',
                  '53528b0fb7dc40cedb721ff714ca710d4c77f4a1',
                  'ebce0d0180da13b873d03b10b3ed8fa6994ee2bf',
                  '981a3d5e9cd1b84e2559c51dcd7e20cfab412a90',
              ],
              '9a2036c6a892b18fbcee5beb77c1373dfd5911acce989dd62138f69d1f767236',
              Path('/tmp/refinement-vision-checkpoint.tar.gz'),
          )
          fetch_archive(
              [
                  '7fdb519f9efc9b624521eefef1a2b1caa0437dd5',
                  '129ad60bee64aa5f4e57e5035fe4be9a86939364',
                  'e5bd0348efd771bf0f68334257b16956f282c983',
                  '28b4501a3276f045a35ee7cfcf87ed9e0ca53651',
                  'df4215292ca2ab4f853b390222f233a27395da47',
                  '471c62dd805526837898e40b2cb7d3a37cf7dafe',
                  '4679bdb4a09f8e0bc52a3f2cce7084d065ddc1e6',
                  'a58423f8306dfdc74c3c3a4f70b8dc78145b2fe4',
                  '12913809f3235743778a18447330f2d10846394b',
                  '854a43a71c6ff74fd8303183c2ff14c2a503086a',
                  '0914dfb550a08cfef1591a5d53f76af7547eb969',
                  '2a477c3c863b5681d76dea62ad5886d1857a6a86',
                  '8fb644f735d5c21882259435fe5038d85c4c3102',
              ],
              'b65e55dc9e526d53526e5315c37549a934fdd7b628f10fc381df44d861ead478',
              Path('/tmp/refinement-vision-delta.tar.gz'),
          )

          evidence = Path('src/kicad_pcb/refinement/evidence.py')
          replace_exact(evidence, 'from typing import Any\n', 'from typing import Any, cast\n', 1)
          replace_exact(
              evidence,
              '    if is_dataclass(value):\n        return _jsonable(asdict(value))\n',
              '    if is_dataclass(value) and not isinstance(value, type):\n'
              '        return _jsonable(asdict(cast(Any, value)))\n',
              1,
          )

          wizard = Path('src/kicad_pcb_web/services/wizard.py')
          replace_exact(
              wizard,
              '    _build_spec_messages,\n    _call_llm_for_json,\n',
              '    _build_spec_messages,\n    StructuredJsonCallOptions,\n    _call_llm_for_json,\n',
              1,
          )
          replace_exact(
              wizard,
              '                response_model=SpecConversationOutput,\n'
              '                max_repairs=settings.llm.spec_max_repair_rounds,\n'
              '                debug_artifact_writer=_make_debug_artifact_writer(\n'
              '                    settings, session.id, stage="spec"\n'
              '                ),\n',
              '                response_model=SpecConversationOutput,\n'
              '                options=StructuredJsonCallOptions(\n'
              '                    max_repairs=settings.llm.spec_max_repair_rounds,\n'
              '                    debug_artifact_writer=_make_debug_artifact_writer(\n'
              '                        settings, session.id, stage="spec"\n'
              '                    ),\n'
              '                ),\n',
              2,
          )
          replace_exact(
              wizard,
              '                        response_model=IrGenerationOutput,\n'
              '                        attempt=attempt,\n'
              '                        debug_artifact_writer=_make_debug_artifact_writer(\n'
              '                            settings, session.id, stage="ir"\n'
              '                        ),\n',
              '                        response_model=IrGenerationOutput,\n'
              '                        attempt=attempt,\n'
              '                        options=StructuredJsonCallOptions(\n'
              '                            debug_artifact_writer=_make_debug_artifact_writer(\n'
              '                                settings, session.id, stage="ir"\n'
              '                            ),\n'
              '                        ),\n',
              1,
          )

          robustness = Path('tests/unit/test_wizard_llm_robustness.py')
          replace_exact(
              robustness,
              'from kicad_pcb_web.services._wizard_llm import _call_llm_for_json\n',
              'from kicad_pcb_web.services._wizard_llm import StructuredJsonCallOptions, _call_llm_for_json\n',
              1,
          )
          replace_exact(
              robustness,
              'max_repairs=1,',
              'options=StructuredJsonCallOptions(max_repairs=1),',
              2,
          )
          replace_exact(
              robustness,
              'max_repairs=2,',
              'options=StructuredJsonCallOptions(max_repairs=2),',
              3,
          )

          client_tests = Path('tests/web/test_web_llm_clients.py')
          replace_exact(
              client_tests,
              'from kicad_pcb_web.services.wizard import _build_spec_messages, _call_llm_for_json\n',
              'from kicad_pcb_web.services._wizard_llm import StructuredJsonCallOptions\n'
              'from kicad_pcb_web.services.wizard import _build_spec_messages, _call_llm_for_json\n',
              1,
          )
          replace_exact(
              client_tests,
              'max_repairs=settings.llm.spec_max_repair_rounds,',
              'options=StructuredJsonCallOptions(max_repairs=settings.llm.spec_max_repair_rounds),',
              1,
          )
          print('checkpoint_interface_migration=applied')
          PY
      - name: Sync locked toolchain
        run: uv sync --frozen --extra dev --extra web
      - name: Canonical format and validate
        run: |
          mapfile -t FILES < <(tar -tzf /tmp/refinement-vision-checkpoint.tar.gz)
          uv run ruff format "${FILES[@]}"
          uv run ruff check --fix --select I "${FILES[@]}"
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src/kicad_pcb src/kicad_pcb_web
          uv run pytest -q \
            tests/unit/test_refinement_*.py \
            tests/web/test_web_llm_*.py \
            tests/web/test_web_refinement_llm.py \
            tests/web/test_web_schematic_refinement.py \
            tests/web/test_web_settings.py \
            tests/unit/test_wizard_llm_robustness.py
          git diff --check
      - name: Commit verified vision refinement tranche
        run: |
          mapfile -t FILES < <(tar -tzf /tmp/refinement-vision-checkpoint.tar.gz)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${FILES[@]}"
          git commit -m 'feat: add bounded schematic vision refinement service'
          git push origin HEAD:webapp
