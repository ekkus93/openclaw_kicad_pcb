name: Ruff format probe

on:
  push:
    branches: [webapp]
    paths:
      - .github/workflows/ruff-format-probe.yml
      - tests/web/test_web_llm_production_hardening.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked formatter
        run: uv sync --frozen --extra dev --extra web
      - name: Print canonical Ruff diff
        run: |
          uv run ruff format tests/web/test_web_llm_production_hardening.py
          git diff -- tests/web/test_web_llm_production_hardening.py
