name: Apply Hardening Generated Outputs Once

on:
  push:
    branches: [webapp]
    paths:
      - .github/workflows/apply-hardening-generated-once.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: webapp
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Format changed Python sources
        run: |
          uv sync --frozen --extra dev --extra web
          uv run ruff format \
            src/kicad_pcb_web/routes/api_jobs.py \
            src/kicad_pcb_web/services/wizard.py

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Rebuild committed SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit formatter and generated SPA outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/kicad_pcb_web/routes/api_jobs.py \
            src/kicad_pcb_web/services/wizard.py \
            src/kicad_pcb_web/static/spa
          if git diff --cached --quiet; then
            echo 'No formatter or generated SPA changes to commit.'
            exit 0
          fi
          git commit -m 'chore: format hardening code and refresh SPA bundle'
          git push origin HEAD:webapp
